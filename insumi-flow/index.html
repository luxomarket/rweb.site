<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061a2f"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="INSUMI Flow">
<title>INSUMI Flow</title><link rel="manifest" href="./manifest.webmanifest">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061a2f}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}#install{position:fixed;right:12px;bottom:12px;z-index:9;border:1px solid #ffffff2b;background:#062433ee;color:#fff;border-radius:14px;padding:10px 13px;font:700 12px system-ui;display:none;box-shadow:0 14px 34px #0006}</style>
</head><body><iframe src="../insumi-demo/" title="INSUMI Flow"></iframe><button id="install">Instalar INSUMI Flow</button>
<script>
let promptEvent;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;install.style.display='block'});
install.onclick=async()=>{if(!promptEvent)return;promptEvent.prompt();await promptEvent.userChoice;install.style.display='none';promptEvent=null};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
