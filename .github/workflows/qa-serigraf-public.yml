name: QA Serigraf Public Demo
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/qa-serigraf-public.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public Render deployment
        shell: bash
        run: |
          set -euo pipefail
          base="https://serigraf-demo.onrender.com"
          for i in {1..6}; do
            if curl -fsSL --connect-timeout 15 --max-time 30 "$base/" -o index.html; then
              break
            fi
            sleep 5
          done
          curl -fsSL --connect-timeout 15 --max-time 30 "$base/styles.css" -o styles.css
          curl -fsSL --connect-timeout 15 --max-time 30 "$base/app.js" -o app.js
          test -s index.html
          test -s styles.css
          test -s app.js
          grep -Fq "SERIGRAF S.R.L. · DEMO DE SISTEMA" index.html
          grep -Fq "Pedidos y cotizaciones" index.html
          grep -Fq "Portal del cliente" index.html
          grep -Fq "localStorage" app.js
          grep -Fq "@media (max-width:820px)" styles.css
          node --check app.js
          echo "PUBLIC_QA_OK"
          wc -c index.html styles.css app.js
