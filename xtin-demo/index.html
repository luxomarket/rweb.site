function clone(o){return JSON.parse(JSON.stringify(o))}
function load(){try{const x=localStorage.getItem(STORAGE_KEY);return x?JSON.parse(x):clone(seed)}catch(e){return clone(seed)}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(db))}

function id(prefix){return prefix+Math.random().toString(36).slice(2,8)}
function today(){return new Date(DEMO_NOW+'T12:00:00')}
function d(s){return new Date(s+'T12:00:00')}
function daysUntil(s){return Math.round((d(s)-today())/86400000)}
function fmtDate(s){if(!s)return'—';return d(s).toLocaleDateString('es-PY',{day:'2-digit',month:'2-digit',year:'numeric'})}
function money(n){if(!n)return'—';return new Intl.NumberFormat('es-PY').format(Number(n))+' Gs.'}
function client(cid){return db.clients.find(x=>x.id===cid)}
function site(sid){for(const c of db.clients){const s=c.sites.find(x=>x.id===sid);if(s)return s}return null}
function tech(tid){return db.technicians.find(x=>x.id===tid)}
function equipment(eid){return db.equipment.find(x=>x.id===eid)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function eqState(e){const n=daysUntil(e.nextService);if(n<0)return'expired';if(n<=60)return'warning';if(e.status==='service')return'service';return'good'}
function stateHtml(state){const map={good:['good','Al día'],warning:['warn','Próximo a vencer'],expired:['bad','Vencido'],service:['info','Servicio programado'],scheduled:['info','Programado'],pending:['warn','Pendiente'],progress:['info','En proceso'],completed:['good','Completado'],replacement:['bad','Requiere reemplazo'],done:['good','Finalizada'],generated:['info','Generado'],delivered:['good','Entregado']};const m=map[state]||['neutral',state];return`<span class="status ${m[0]}"><i></i>${m[1]}</span>`}

function showQR(eid){const e=equipment(eid),seedNum=[...eid+e.serial].reduce((a,c)=>a+c.charCodeAt(0),0);let cells='';for(let i=0;i<441;i++){const x=i%21,y=Math.floor(i/21);const finder=(x<7&&y<7)||(x>=14&&y<7)||(x<7&&y>=14);const border=finder&&(x%7===0||x%7===6||y%7===0||y%7===6);const center=finder&&(x%7>=2&&x%7<=4&&y%7>=2&&y%7<=4);const on=border||center||((i*17+seedNum*13+i*i)%11<4);cells+=`<i class="${on?'on':''}"></i>`}openModal('Identificación QR simulada',`<div class="qr-card"><div class="qr">${cells}</div><h3>${esc(e.code)} · ${esc(e.serial)}</h3><p>${esc(client(e.clientId)?.name||'')} · ${esc(site(e.siteId)?.name||'')}</p>${stateHtml(eqState(e))}<div class="notice gray" style="margin-top:14px;text-align:left">En una implementación real, este QR puede abrir la ficha móvil del equipo para registrar inspección, recarga, fotografías y próximo servicio.</div></div>`)}
function renderInspections(){document.getElementById('view-inspections').innerHTML=`<div class="view-head"><div><h1>Inspecciones</h1><p>Programar visita, seleccionar equipos, asignar técnico y cerrar resultado actualizando el historial.</p></div><div class="actions"><button class="btn primary" onclick="newInspection()">+ Programar inspección</button></div></div><div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Cliente / sede</th><th>Equipos</th><th>Técnico</th><th>Estado</th><th>Resultado</th><th>Acción</th></tr></thead><tbody>${db.inspections.map(i=>`<tr><td><b>${fmtDate(i.date)}</b></td><td>${esc(client(i.clientId)?.name||'')}<div class="muted">${esc(site(i.siteId)?.name||'')}</div></td><td>${i.equipmentIds.length}</td><td>${esc(tech(i.technicianId)?.name||'')}</td><td>${stateHtml(i.status)}</td><td>${esc(i.result||'—')}</td><td>${i.status==='done'?`<button class="btn sm" onclick="inspectionDetail('${i.id}')">Ver</button>`:`<button class="btn sm primary" onclick="completeInspection('${i.id}')">Completar</button>`}</td></tr>`).join('')}</tbody></table></div>`}
function newInspection(){const opts=db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');openModal('Programar inspección',`<form id="inspForm" class="form-grid"><div class="field"><label>Cliente</label><select name="clientId" id="inspClient" onchange="inspectionClientChanged()">${opts}</select></div><div class="field"><label>Sede</label><select name="siteId" id="inspSite" onchange="inspectionSiteChanged()"></select></div><div class="field"><label>Fecha</label><input name="date" type="date" value="2026-10-08" required></div><div class="field"><label>Técnico</label><select name="technicianId">${db.technicians.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="field full"><label>Equipos</label><div id="inspEquipment" class="grid cols-3"></div></div><div class="field full"><label>Observaciones</label><textarea name="notes"></textarea></div></form>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveInspection()">Programar</button>`);inspectionClientChanged()}

function completeInspection(iid){const i=db.inspections.find(x=>x.id===iid);openModal('Completar inspección',`<form id="completeInsp" class="form-grid"><div class="field full"><label>Checklist</label><label class="detail-box"><input type="checkbox" checked> Accesibilidad y ubicación verificadas</label><label class="detail-box"><input type="checkbox" checked> Estado exterior revisado</label><label class="detail-box"><input type="checkbox" checked> Manómetro / indicador revisado cuando corresponde</label><label class="detail-box"><input type="checkbox" checked> Etiquetado y vencimiento revisados</label></div><div class="field full"><label>Resultado</label><select name="result"><option>Sin observaciones</option><option>Requiere mantenimiento</option><option>Requiere recarga</option><option>Requiere reemplazo</option></select></div><div class="field full"><label>Notas</label><textarea name="notes">${esc(i.notes||'')}</textarea></div></form>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveInspectionComplete('${iid}')">Cerrar inspección</button>`)}
function saveInspectionComplete(iid){const f=document.getElementById('completeInsp'),o=Object.fromEntries(new FormData(f)),i=db.inspections.find(x=>x.id===iid);i.status='done';i.result=o.result;i.notes=o.notes;i.equipmentIds.forEach(eid=>{const e=equipment(eid);e.lastInspection=i.date;e.history.push([i.date,`Inspección: ${o.result}`])});save();closeModal();renderAll();toast('Inspección finalizada e historial actualizado')}

function renderServices(){document.getElementById('view-services').innerHTML=`<div class="view-head"><div><h1>Recargas y mantenimiento</h1><p>Órdenes de servicio vinculadas a un equipo concreto y a su próximo mantenimiento.</p></div><div class="actions"><button class="btn primary" onclick="newService()">+ Crear servicio</button></div></div><div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Equipo</th><th>Tipo</th><th>Técnico</th><th>Estado</th><th>Costo demo</th><th>Acción</th></tr></thead><tbody>${db.services.map(s=>`<tr><td>${fmtDate(s.date)}</td><td><b>${esc(client(s.clientId)?.name||'')}</b><div class="muted">${esc(site(s.siteId)?.name||'')}</div></td><td>${esc(equipment(s.equipmentId)?.code||'')}<div class="muted">${esc(equipment(s.equipmentId)?.type||'')}</div></td><td>${esc(s.type)}</td><td>${esc(tech(s.technicianId)?.name||'')}</td><td>${stateHtml(s.status)}</td><td>${money(s.cost)}</td><td><button class="btn sm" onclick="serviceDetail('${s.id}')">Gestionar</button></td></tr>`).join('')}</tbody></table></div>`}

function saveService(){const f=document.getElementById('serviceForm');if(!f.reportValidity())return;const o=Object.fromEntries(new FormData(f));if(!o.equipmentId){toast('La sede no tiene equipos');return}db.services.push({...o,id:id('sv'),status:'pending'});equipment(o.equipmentId).status='service';equipment(o.equipmentId).history.push([DEMO_NOW,'Orden de servicio creada']);save();closeModal();renderAll();toast('Orden de servicio creada')}

function serviceDetail(sid){const s=db.services.find(x=>x.id===sid),e=equipment(s.equipmentId);openModal('Gestionar servicio',`<div class="detail-grid"><div class="detail-box"><span>Cliente</span><b>${esc(client(s.clientId)?.name||'')}</b><div class="muted">${esc(site(s.siteId)?.name||'')}</div></div><div class="detail-box"><span>Equipo</span><b>${esc(e?.code||'')}</b><div class="muted">${esc(e?.type||'')} ${esc(e?.capacity||'')}</div></div><div class="detail-box"><span>Servicio</span><b>${esc(s.type)}</b><div class="muted">${fmtDate(s.date)} · ${esc(tech(s.technicianId)?.name||'')}</div></div><div class="detail-box"><span>Estado actual</span>${stateHtml(s.status)}</div></div><h3>Cambiar estado</h3><div class="actions"><button class="btn sm" onclick="setServiceStatus('${sid}','pending')">Pendiente</button><button class="btn sm" onclick="setServiceStatus('${sid}','scheduled')">Programado</button><button class="btn sm" onclick="setServiceStatus('${sid}','progress')">En proceso</button><button class="btn sm primary" onclick="completeService('${sid}')">Completar servicio</button><button class="btn sm danger" onclick="setServiceStatus('${sid}','replacement')">Requiere reemplazo</button></div><div class="notice gray" style="margin-top:15px">${esc(s.notes||'Sin observaciones')}</div>`)}

function completeService(sid){const s=db.services.find(x=>x.id===sid),e=equipment(s.equipmentId);openModal('Completar servicio',`<form id="completeServiceForm" class="form-grid"><div class="field"><label>Fecha realizada</label><input name="date" type="date" value="${s.date}" required></div><div class="field"><label>Próximo servicio</label><input name="nextService" type="date" value="2027-10-08" required></div><div class="field full"><label>Resultado</label><textarea name="result">Servicio completado. Equipo habilitado dentro de esta simulación.</textarea></div></form>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveCompletedService('${sid}')">Completar y actualizar equipo</button>`)}

function renderAlerts(){const list=db.equipment.map(e=>({e,n:daysUntil(e.nextService)})).filter(x=>x.n<=60).sort((a,b)=>a.n-b.n);document.getElementById('view-alerts').innerHTML=`<div class="view-head"><div><h1>Alertas de vencimiento</h1><p>Prioriza a quién contactar antes del vencimiento y convierte seguimiento técnico en nueva orden de servicio.</p></div></div><div class="grid">${list.map(({e,n})=>{const c=client(e.clientId),cls=n<0?'bad':n<=15?'':'good';return`<div class="card alert-card ${cls}"><div class="alert-head"><div><h3>${n<0?'Vencido':n===0?'Vence hoy':`Vence en ${n} días`} — ${esc(c?.name||'')}</h3><p>${esc(site(e.siteId)?.name||'')} · ${esc(e.code)} · ${esc(e.type)} ${esc(e.capacity)}</p></div><div class="alert-actions"><button class="btn sm" onclick="equipmentDetail('${e.id}')">Ficha</button><button class="btn sm primary" onclick="newService('${e.id}')">Preparar servicio</button></div></div><div class="alert-detail"><span><b>Ubicación:</b> ${esc(e.location)}</span><span><b>Última recarga:</b> ${fmtDate(e.lastRecharge)}</span><span><b>Próximo servicio:</b> ${fmtDate(e.nextService)}</span></div></div>`}).join('')||'<div class="card empty"><b>Sin alertas</b>No hay vencimientos dentro de 60 días.</div>'}</div>`}
function renderCalendar(){const y=2026,m=9;const first=new Date(y,m,1),start=(first.getDay()+6)%7;const days=new Date(y,m+1,0).getDate();const cells=[];for(let i=0;i<start;i++)cells.push('');for(let day=1;day<=days;day++){const ds=`2026-10-${String(day).padStart(2,'0')}`;const events=[];db.inspections.filter(x=>x.date===ds).forEach(x=>events.push(`<div class="event inspection">Inspección · ${esc(client(x.clientId)?.name||'')}</div>`));db.services.filter(x=>x.date===ds&&!['completed'].includes(x.status)).forEach(x=>events.push(`<div class="event service">Servicio · ${esc(client(x.clientId)?.name||'')}</div>`));db.equipment.filter(x=>x.nextService===ds).forEach(x=>events.push(`<div class="event expiry">Vence ${esc(x.code)}</div>`));cells.push(`<div class="day"><span class="num">${day}</span>${events.join('')}</div>`)}while(cells.length%7)cells.push('');document.getElementById('view-calendar').innerHTML=`<div class="view-head"><div><h1>Calendario operativo</h1><p>Inspecciones, servicios y vencimientos consolidados en una sola agenda.</p></div><div class="actions"><button class="btn" onclick="newInspection()">+ Inspección</button><button class="btn primary" onclick="newService()">+ Servicio</button></div></div><div class="card panel"><div class="panel-head"><div><h2>Octubre 2026</h2><p>Vista demostrativa</p></div><div class="actions"><span class="status info"><i></i>Inspección</span><span class="status bad"><i></i>Servicio</span><span class="status warn"><i></i>Vencimiento</span></div></div><div class="calendar">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x=>`<div class="cal-head">${x}</div>`).join('')}${cells.join('')}</div></div>`}
function renderCertificates(){document.getElementById('view-certificates').innerHTML=`<div class="view-head"><div><h1>Certificados</h1><p>Control documental vinculado a cliente, sede y equipos. En esta demo no se generan certificados oficiales.</p></div><div class="actions"><button class="btn primary" onclick="newCertificate()">+ Generar certificado demo</button></div></div><div class="notice red" style="margin-bottom:14px"><strong>Importante:</strong> todos los documentos generados aquí llevan la leyenda DOCUMENTO DEMOSTRATIVO.</div><div class="table-wrap"><table><thead><tr><th>Número</th><th>Fecha</th><th>Cliente / sede</th><th>Equipos</th><th>Responsable</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${db.certificates.map(c=>`<tr><td class="mono"><b>${esc(c.number)}</b></td><td>${fmtDate(c.date)}</td><td>${esc(client(c.clientId)?.name||'')}<div class="muted">${esc(site(c.siteId)?.name||'')}</div></td><td>${c.equipmentIds.length}</td><td>${esc(c.responsible)}</td><td>${stateHtml(c.status)}</td><td><button class="btn sm" onclick="viewCertificate('${c.id}')">Abrir</button>${c.status!=='delivered'?` <button class="btn sm" onclick="markCertificateDelivered('${c.id}')">Marcar entregado</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}
function newCertificate(){const opts=db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');openModal('Generar certificado demostrativo',`<form id="certForm" class="form-grid"><div class="field"><label>Cliente</label><select name="clientId" id="certClient" onchange="certClientChanged()">${opts}</select></div><div class="field"><label>Sede</label><select name="siteId" id="certSite" onchange="certSiteChanged()"></select></div><div class="field"><label>Fecha</label><input name="date" type="date" value="${DEMO_NOW}"></div><div class="field"><label>Responsable</label><input name="responsible" value="Responsable técnico demo"></div><div class="field full"><label>Equipos incluidos</label><div id="certEquipment" class="grid cols-3"></div></div></form>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveCertificate()">Generar</button>`);certClientChanged()}

function saveCertificate(){const f=document.getElementById('certForm');if(!f.reportValidity())return;const o=Object.fromEntries(new FormData(f));const eq=[...document.querySelectorAll('input[name="certEq"]:checked')].map(x=>x.value);if(!eq.length){toast('Seleccioná al menos un equipo');return}const num=`DEMO-2026-${String(db.certificates.length+42).padStart(4,'0')}`;const c={id:id('ct'),clientId:o.clientId,siteId:o.siteId,date:o.date,equipmentIds:eq,status:'generated',responsible:o.responsible,number:num};db.certificates.push(c);eq.forEach(eid=>equipment(eid).history.push([o.date,'Certificado demostrativo generado']));save();closeModal();renderAll();toast('Certificado demostrativo generado');viewCertificate(c.id)}
function viewCertificate(cid){const c=db.certificates.find(x=>x.id===cid);const eq=c.equipmentIds.map(equipment);openModal('Documento demostrativo',`<div class="cert"><h1>X-TIN PARAGUAY</h1><div class="sub">Control de servicio contra incendios · Demo</div><div class="cert-grid"><div><b>Nº</b><br>${esc(c.number)}</div><div><b>Fecha</b><br>${fmtDate(c.date)}</div><div><b>Cliente</b><br>${esc(client(c.clientId)?.name||'')}</div><div><b>Sede</b><br>${esc(site(c.siteId)?.name||'')}</div><div><b>Responsable</b><br>${esc(c.responsible)}</div><div><b>Equipos</b><br>${eq.length}</div></div><h3>Equipos incluidos</h3>${eq.map(e=>`<div class="list-row"><div class="grow"><b>${esc(e.code)} · ${esc(e.type)} ${esc(e.capacity)}</b><span>Serie ${esc(e.serial)} · Próximo servicio ${fmtDate(e.nextService)}</span></div></div>`).join('')}<div class="cert-note">DOCUMENTO DEMOSTRATIVO — NO VÁLIDO COMO CERTIFICADO OFICIAL</div></div>`,`<button class="btn" onclick="window.print()">Imprimir / Guardar PDF</button><button class="btn primary" onclick="closeModal()">Cerrar</button>`);document.getElementById('modal').classList.add('cert-only')}
function markCertificateDelivered(cid){db.certificates.find(x=>x.id===cid).status='delivered';save();renderAll();toast('Certificado marcado como entregado')}
function renderTechnicians(){document.getElementById('view-technicians').innerHTML=`<div class="view-head"><div><h1>Técnicos</h1><p>Vista operativa de carga de trabajo. No es un módulo de RRHH.</p></div></div><div class="grid tech-grid">${db.technicians.map(t=>{const s=db.services.filter(x=>x.technicianId===t.id),todayJobs=s.filter(x=>x.date===DEMO_NOW&&x.status!=='completed').length,active=s.filter(x=>!['completed','replacement'].includes(x.status)).length,done=s.filter(x=>x.status==='completed').length;return`<div class="card tech"><div class="tech-head"><div class="avatar">${esc(t.name.split(' ').map(x=>x[0]).join('').slice(0,2))}</div><div><h3>${esc(t.name)}</h3><p>${esc(t.role)} · ${esc(t.phone)}</p></div></div><div class="tech-stats"><div><b>${todayJobs}</b><span>Hoy</span></div><div><b>${active}</b><span>Activos</span></div><div><b>${done}</b><span>Completados</span></div></div></div>`}).join('')}</div>`}
function renderPortal(){const cid=db.clients[0]?.id||'';document.getElementById('view-portal').innerHTML=`<div class="view-head"><div><h1>Portal del cliente</h1><p>Vista simplificada: el cliente de X-TIN ve únicamente sus sedes, equipos, vencimientos, servicios y documentos.</p></div><div class="actions"><select class="btn" id="portalClient" onchange="renderPortalClient()">${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div></div><div id="portalShell"></div>`;document.getElementById('portalClient').value=cid;renderPortalClient()}
function renderPortalClient(){const cid=document.getElementById('portalClient')?.value||db.clients[0]?.id,c=client(cid);if(!c)return;const eq=equipmentByClient(cid),services=db.services.filter(s=>s.clientId===cid),certs=db.certificates.filter(x=>x.clientId===cid);document.getElementById('portalShell').innerHTML=`<div class="portal"><div class="portal-top"><div class="portal-brand"><div class="brand-mark">X</div><div><b style="font-size:18px">Portal X-TIN</b><div style="color:#bfc3c8">${esc(c.name)}</div></div></div><span class="badge-demo">VISTA CLIENTE · DEMO</span></div><div class="portal-content"><div class="grid portal-kpis"><div class="card kpi"><div class="label">Sedes</div><div class="value">${c.sites.length}</div></div><div class="card kpi"><div class="label">Equipos</div><div class="value">${eq.length}</div></div><div class="card kpi"><div class="label">Vencidos / próximos</div><div class="value">${eq.filter(e=>['expired','warning'].includes(eqState(e))).length}</div></div><div class="card kpi"><div class="label">Servicios activos</div><div class="value">${services.filter(s=>!['completed','replacement'].includes(s.status)).length}</div></div></div><div class="grid cols-2" style="margin-top:16px"><div class="card panel"><div class="panel-head"><div><h2>Mis equipos</h2><p>Estado y próximo servicio</p></div></div><div class="list">${eq.map(e=>`<div class="list-row"><span class="dot ${eqState(e)==='good'?'good':eqState(e)==='expired'?'bad':'warn'}"></span><div class="grow"><b>${esc(e.code)} · ${esc(e.type)} ${esc(e.capacity)}</b><span>${esc(site(e.siteId)?.name||'')} · ${esc(e.location)}</span></div><div class="row-meta">${fmtDate(e.nextService)}</div></div>`).join('')||'<div class="empty">Sin equipos</div>'}</div></div><div class="card panel"><div class="panel-head"><div><h2>Documentos y servicios</h2><p>Historial visible al cliente</p></div></div><div class="list">${services.map(s=>`<div class="list-row"><div class="grow"><b>${esc(s.type)}</b><span>${fmtDate(s.date)} · ${esc(equipment(s.equipmentId)?.code||'')}</span></div>${stateHtml(s.status)}</div>`).join('')}${certs.map(ct=>`<div class="list-row"><div class="grow"><b>Certificado demo ${esc(ct.number)}</b><span>${fmtDate(ct.date)}</span></div>${stateHtml(ct.status)}</div>`).join('')||''}</div></div></div></div></div>`}
function globalSearch(){const q=document.getElementById('globalSearch').value.trim().toLowerCase();if(!q)return;const e=db.equipment.find(e=>[e.code,e.serial,e.type,e.location,client(e.clientId)?.name,site(e.siteId)?.name].join(' ').toLowerCase().includes(q));if(e){setView('equipment');setTimeout(()=>{document.getElementById('eqSearch').value=q;filterEquipment();document.querySelector(`[data-eqrow="${e.id}"]`)?.scrollIntoView({behavior:'smooth',block:'center'})},50);return}const c=db.clients.find(c=>[c.name,c.contact,c.ruc,c.phone].join(' ').toLowerCase().includes(q));if(c){setView('clients');setTimeout(()=>clientDetail(c.id),80);return}toast('Sin coincidencias en la demo')}
function renderView(v){({dashboard:renderDashboard,clients:renderClients,equipment:renderEquipment,inspections:renderInspections,services:renderServices,alerts:renderAlerts,calendar:renderCalendar,certificates:renderCertificates,technicians:renderTechnicians,portal:renderPortal}[v]||renderDashboard)()}
function renderAll(){renderDashboard();renderClients();renderEquipment();renderInspections();renderServices();renderAlerts();renderCalendar();renderCertificates();renderTechnicians();renderPortal();document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===currentView))}
buildNav();renderAll();setView('dashboard');
document.getElementById('resetBtn').addEventListener('click',()=>{if(confirm('¿Restaurar todos los datos demostrativos?'))reset()});document.getElementById('globalSearchBtn').addEventListener('click',globalSearch);document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter')globalSearch()});
</script>
</body>
</html>
