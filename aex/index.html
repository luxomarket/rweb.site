function addressFields(prefix,title){const city=ship[prefix+'City'],no=ship[prefix+'NoNumber'];return `<div class="field full"><h3 style="margin:0 0 2px">${title}</h3><span class="helper">Completá datos que realmente ayuden a localizar el domicilio.</span></div><div class="field"><label>Ciudad</label><input class="input ${err(prefix+'City')}" id="${prefix}City" value="${escapeHtml(city)}" placeholder="Ej.: Asunción">${errorText(prefix+'City')}</div><div class="field"><label>Barrio</label><input class="input ${err(prefix+'Neighborhood')}" id="${prefix}Neighborhood" value="${escapeHtml(ship[prefix+'Neighborhood'])}" placeholder="Ej.: San José">${errorText(prefix+'Neighborhood')}</div><div class="field"><label>Calle / avenida</label><input class="input" id="${prefix}Street" value="${escapeHtml(ship[prefix+'Street'])}" placeholder="Ej.: Av. España"></div><div class="field"><label>N.º de casa</label><input class="input ${err(prefix+'Number')}" id="${prefix}Number" value="${escapeHtml(ship[prefix+'Number'])}" placeholder="Ej.: 245" ${no?'disabled':''}>${errorText(prefix+'Number')}<label class="check-line"><input type="checkbox" id="${prefix}NoNumber" ${no?'checked':''}> La vivienda no tiene número</label></div><div class="field"><label>Color de vivienda ${no?'<b style="color:#b84545">*</b>':'<span class="helper">(opcional)</span>'}</label><input class="input ${err(prefix+'Color')}" id="${prefix}Color" value="${escapeHtml(ship[prefix+'Color'])}" placeholder="Ej.: Amarillo">${errorText(prefix+'Color')}</div><div class="field"><label>Punto de referencia ${no?'<b style="color:#b84545">*</b>':'<span class="helper">(recomendado)</span>'}</label><input class="input ${err(prefix+'Reference')}" id="${prefix}Reference" value="${escapeHtml(ship[prefix+'Reference'])}" placeholder="Ej.: frente a Despensa San José">${errorText(prefix+'Reference')}</div><div class="field full"><button type="button" class="btn btn-soft btn-sm" data-location-demo="${prefix}">${icon('location')}Usar mi ubicación</button><div class="address-note">Barrio + N.º de casa ayudan a ubicar el domicilio. Si no existe numeración, el color y una referencia cercana pasan a ser obligatorios.</div></div>`}
function err(k){return shipErrors[k]?'error':''}function errorText(k){return shipErrors[k]?`<small class="error-text">${escapeHtml(shipErrors[k])}</small>`:''}
function validateAddress(prefix){const e={};if(!ship[prefix+'City'].trim())e[prefix+'City']='Ingresá la ciudad.';if(!ship[prefix+'Neighborhood'].trim())e[prefix+'Neighborhood']='Ingresá el barrio.';if(!ship[prefix+'NoNumber']&&!ship[prefix+'Number'].trim())e[prefix+'Number']='Ingresá el N.º de casa o marcá que la vivienda no tiene número.';if(ship[prefix+'NoNumber']&&!ship[prefix+'Color'].trim())e[prefix+'Color']='Indicá el color de la vivienda porque no tiene número.';if(ship[prefix+'NoNumber']&&!ship[prefix+'Reference'].trim())e[prefix+'Reference']='Agregá una referencia cercana, por ejemplo una despensa o supermercado.';return e}
function validateStep(){let e={};if(shipStep===1)e=validateAddress('origin');if(shipStep===2)e=validateAddress('destination');if(shipStep===4){if(!ship.weight||+ship.weight<=0)e.weight='Ingresá un peso válido.';if(ship.content==='Otro'&&!ship.contentOther.trim())e.contentOther='Contanos qué tipo de contenido vas a enviar.'}if(shipStep===5){if(!ship.senderName.trim())e.senderName='Ingresá el nombre del remitente.';if(!/^0?9\d{8}$/.test(ship.senderPhone.replace(/\s/g,'')))e.senderPhone='Ingresá un número de teléfono válido.';if(!ship.recipientName.trim())e.recipientName='Ingresá el nombre del destinatario.';if(!/^0?9\d{8}$/.test(ship.recipientPhone.replace(/\s/g,'')))e.recipientPhone='Ingresá un número de teléfono válido.'}return e}
function modeChoice(key,val,title,copy,ico){return `<button class="choice ${ship[key]===val?'selected':''}" data-ship-choice="${key}" data-value="${val}"><div class="choice-icon">${icon(ico)}</div><strong>${title}</strong><small>${copy}</small></button>`}
function wizardBody(quote=false){if(shipStep===1)return `<h2>¿Desde dónde enviás?</h2><p>Definí el punto de retiro para que la operación pueda localizarlo sin llamadas adicionales.</p><div class="field-grid">${addressFields('origin','Origen')}</div>`;if(shipStep===2)return `<h2>¿A dónde lo enviás?</h2><p>Completá el destino con referencias útiles para la entrega.</p><div class="field-grid">${addressFields('destination','Destino')}</div>`;if(shipStep===3)return `<h2>Elegí cómo se mueve tu envío.</h2><p>Podés combinar retiro, Punto AEX, eLocker y entrega a domicilio.</p><div class="field"><label>¿Cómo llega el paquete a AEX?</label><div class="choice-grid">${modeChoice('pickup','Retiro en domicilio','Retiro en domicilio','AEX retira en la dirección indicada.','truck')}${modeChoice('pickup','Punto AEX','Punto AEX','Llevás el paquete a un punto disponible.','pin')}${modeChoice('pickup','eLocker','eLocker','Entrega flexible en locker habilitado.','box')}</div></div><div class="field" style="margin-top:18px"><label>¿Cómo lo recibe el destinatario?</label><div class="choice-grid">${modeChoice('delivery','Domicilio','Entrega a domicilio','Entrega en la dirección cargada.','home')}${modeChoice('delivery','Punto AEX','Punto AEX','Retiro en punto seleccionado.','pin')}${modeChoice('delivery','eLocker','eLocker','Retiro flexible en locker.','box')}</div></div>`;if(shipStep===4)return `<h2>¿Qué enviás?</h2><p>Los datos del paquete preparan la cotización y ayudan a planificar la operación.</p><div class="choice-grid">${['Documento','Paquete','Mercadería','Otro'].map(v=>`<button class="choice ${ship.content===v?'selected':''}" data-ship-choice="content" data-value="${v}"><div class="choice-icon">${icon(v==='Documento'?'quote':'box')}</div><strong>${v}</strong></button>`).join('')}</div>${ship.content==='Otro'?`<div class="field" style="margin-top:14px"><label>Descripción</label><input class="input ${err('contentOther')}" id="contentOther" value="${escapeHtml(ship.contentOther)}" placeholder="Ej.: repuesto electrónico">${errorText('contentOther')}</div>`:''}<div class="field-grid" style="margin-top:16px"><div class="field"><label>Peso (kg)</label><input class="input ${err('weight')}" id="weight" type="number" step="0.1" min="0.1" value="${ship.weight}">${errorText('weight')}</div><div class="field"><label>Dimensiones (cm)</label><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px"><input class="input" id="length" value="${ship.length}" placeholder="Largo"><input class="input" id="width" value="${ship.width}" placeholder="Ancho"><input class="input" id="height" value="${ship.height}" placeholder="Alto"></div></div></div>`;if(shipStep===5)return `<h2>¿Quién envía y quién recibe?</h2><p>Datos mínimos para identificar y contactar a las personas involucradas.</p><div class="field-grid"><div class="field"><label>Remitente</label><input class="input ${err('senderName')}" id="senderName" value="${escapeHtml(ship.senderName)}" placeholder="Nombre y apellido">${errorText('senderName')}</div><div class="field"><label>Teléfono del remitente</label><input class="input ${err('senderPhone')}" id="senderPhone" value="${escapeHtml(ship.senderPhone)}" placeholder="0981 123 456">${errorText('senderPhone')}</div><div class="field"><label>Destinatario</label><input class="input ${err('recipientName')}" id="recipientName" value="${escapeHtml(ship.recipientName)}" placeholder="Nombre y apellido">${errorText('recipientName')}</div><div class="field"><label>Teléfono del destinatario</label><input class="input ${err('recipientPhone')}" id="recipientPhone" value="${escapeHtml(ship.recipientPhone)}" placeholder="0982 123 456">${errorText('recipientPhone')}</div></div>`;if(shipStep===6)return `<h2>Cotización preparada para AEX.</h2><p>La experiencia deja el cálculo listo para conectarse al motor tarifario oficial.</p><div class="quote-panel"><div class="quote-info"><span class="kicker">Resumen</span><div class="summary-route"><span>${escapeHtml(ship.originCity)}</span>${icon('send')}<span>${escapeHtml(ship.destinationCity)}</span></div><div class="summary-grid"><div class="summary-item"><span>Paquete</span><strong>${escapeHtml(ship.content==='Otro'?ship.contentOther:ship.content)} · ${ship.weight} kg</strong></div><div class="summary-item"><span>Modalidad</span><strong>${escapeHtml(ship.pickup)} → ${escapeHtml(ship.delivery)}</strong></div></div><div class="payment-grid">${['Pago online','Pago en agencia','Cuenta empresa'].map(v=>`<button class="pay-option ${ship.payment===v?'selected':''}" data-payment="${v}">${v}</button>`).join('')}</div></div><div class="quote-choice"><span class="kicker" style="color:#7bd9f2">Tarifa</span><div class="price-placeholder">Gs. —</div><p>Valor calculado mediante el motor tarifario AEX.</p><button class="btn btn-primary" style="width:100%;margin-top:14px" id="chooseQuote">Elegir esta opción</button></div></div>`;return confirmationView()}
function structured(prefix){const a=[];a.push(ship[prefix+'City']);if(ship[prefix+'Neighborhood'])a.push('Barrio '+ship[prefix+'Neighborhood']);if(ship[prefix+'Street'])a.push(ship[prefix+'Street']);if(ship[prefix+'NoNumber']){if(ship[prefix+'Color'])a.push('Casa '+ship[prefix+'Color']);if(ship[prefix+'Reference'])a.push('Ref.: '+ship[prefix+'Reference'])}else if(ship[prefix+'Number'])a.push('N.º '+ship[prefix+'Number']);return a.filter(Boolean).join(' · ')}
function qrMarkup(){let seed=(ship.code||'AEX').split('').reduce((a,c)=>a+c.charCodeAt(0),0);let cells='';for(let i=0;i<81;i++){const on=((i*17+seed*7+i*i)%11)<5;cells+=`<i class="${on?'on':''}"></i>`}return `<div class="qr" aria-label="QR visual de demostración">${cells}</div>`}
function confirmationView(){return `<div class="confirm-card"><div class="success-mark">${icon('check')}</div><span class="kicker">Envío creado</span><h2 style="margin-top:8px">Tu envío quedó preparado.</h2><p class="muted">Código de seguimiento</p><div class="confirm-code">${escapeHtml(ship.code||'AEX-458291')}</div><div class="confirm-layout"><div class="summary-box"><div class="summary-route"><span>${escapeHtml(ship.originCity)}</span>${icon('send')}<span>${escapeHtml(ship.destinationCity)}</span></div><div class="summary-grid"><div class="summary-item"><span>Modalidad</span><strong>${escapeHtml(ship.pickup)} → ${escapeHtml(ship.delivery)}</strong></div><div class="summary-item"><span>Peso</span><strong>${ship.weight} kg</strong></div><div class="summary-item"><span>Estado</span><strong>Creado · pendiente de recepción</strong></div><div class="summary-item"><span>Destinatario</span><strong>${escapeHtml(ship.recipientName)}</strong></div></div></div>${qrMarkup()}</div><div class="confirm-actions"><button class="btn btn-outline" id="downloadLabel">${icon('download')}Descargar etiqueta</button><button class="btn btn-outline" id="printGuide">${icon('print')}Imprimir guía</button><button class="btn btn-outline" id="shareTracking">${icon('share')}Compartir seguimiento</button><button class="btn btn-primary" id="viewShipment">${icon('eye')}Ver mi envío</button></div></div>`}
function wizard(quote=false){const labels=['Origen','Destino','Modalidad','Paquete','Personas','Cotización','Confirmación'];return `${routeHeader(quote?'Cotización + creación':'Crear envío',quote?'Cotizá y seguí directo a la creación.':'Un flujo guiado de principio a fin.',quote?'La cotización forma parte del mismo recorrido. No hace falta empezar de nuevo.':'Cada paso captura solo la información necesaria para completar el envío.') }<section class="wizard-wrap"><div class="container"><div class="wizard"><div class="wizard-head"><small>Paso ${shipStep} de 7 · ${labels[shipStep-1]}</small><div class="stepper">${labels.map((_,i)=>`<span class="stepdot ${i+1<shipStep?'done':i+1===shipStep?'current':''}"></span>`).join('')}</div></div><div class="wizard-body ${wizardDir==='back'?'back':''}">${wizardBody(quote)}</div><div class="wizard-footer">${shipStep>1&&shipStep<7?`<button class="btn btn-outline" id="prevStep">${icon('back')}Atrás</button>`:'<span></span>'}${shipStep<6?`<button class="btn btn-primary" id="nextStep">Continuar${icon('chevron')}</button>`:shipStep===6?'<span></span>':'<button class="btn btn-outline" data-route="home">Volver al inicio</button>'}</div></div></div></section>`}
function captureShip(){['originCity','originNeighborhood','originStreet','originNumber','originColor','originReference','destinationCity','destinationNeighborhood','destinationStreet','destinationNumber','destinationColor','destinationReference','contentOther','weight','length','width','height','senderName','senderPhone','recipientName','recipientPhone'].forEach(k=>{const e=$('#'+k);if(e)ship[k]=e.value.trim()});['origin','destination'].forEach(p=>{const e=$('#'+p+'NoNumber');if(e)ship[p+'NoNumber']=e.checked})}
function createShipment(){if(!ship.code)ship.code='AEX-'+String(458300+getShipments().length+Math.floor(Math.random()*40));const arr=getShipments();if(!arr.some(x=>x.id===ship.code)){arr.unshift({id:ship.code,customer:ship.senderName,recipient:ship.recipientName,origin:ship.originCity,destination:ship.destinationCity,service:`${ship.pickup} → ${ship.delivery}`,weight:`${ship.weight} kg`,status:'Creado',owner:'Sin asignar',date:new Intl.DateTimeFormat('es-PY').format(new Date()),updated:new Date().toLocaleTimeString('es-PY',{hour:'2-digit',minute:'2-digit'}),issue:false,notes:[],originDetail:structured('origin'),destinationDetail:structured('destination')});saveShipments(arr);safeStorage.set(LS_LAST,ship.code)}toast('Envío creado.');shipStep=7;render()}
function bindWizard(){if($('#prevStep'))$('#prevStep').onclick=()=>{captureShip();shipErrors={};wizardDir='back';shipStep--;render()};if($('#nextStep'))$('#nextStep').onclick=()=>{captureShip();shipErrors=validateStep();if(Object.keys(shipErrors).length){render();toast('Revisá los datos marcados antes de continuar.','warn');return}wizardDir='forward';shipStep++;render()};$$('[data-ship-choice]').forEach(b=>b.onclick=()=>{ship[b.dataset.shipChoice]=b.dataset.value;render()});$$('[data-payment]').forEach(b=>b.onclick=()=>{ship.payment=b.dataset.payment;render()});$$('[data-location-demo]').forEach(b=>b.onclick=()=>toast('Ubicación preparada para integración con permisos del dispositivo.'));['origin','destination'].forEach(p=>{const e=$('#'+p+'NoNumber');if(e)e.onchange=()=>{ship[p+'NoNumber']=e.checked;if(e.checked)ship[p+'Number']='';render()}});if($('#chooseQuote'))$('#chooseQuote').onclick=()=>{captureShip();showLoading('Calculando opción con el motor tarifario conceptual…',()=>createShipment())};if($('#downloadLabel'))$('#downloadLabel').onclick=downloadLabel;if($('#printGuide'))$('#printGuide').onclick=()=>window.print();if($('#shareTracking'))$('#shareTracking').onclick=shareTracking;if($('#viewShipment'))$('#viewShipment').onclick=()=>go('track','code='+encodeURIComponent(ship.code));}
function showLoading(text,done){showModal(`<div class="modal-head"><h3>${escapeHtml(text)}</h3></div><div class="loading-line"><i></i></div>`);setTimeout(()=>{$('#modalRoot').innerHTML='';done&&done()},650)}
function downloadLabel(){const blob=new Blob([`AEX · ETIQUETA DEMO\n${ship.code}\n${ship.originCity} -> ${ship.destinationCity}\n${ship.recipientName}\n${structured('destination')}`],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${ship.code}-etiqueta-demo.txt`;a.click();URL.revokeObjectURL(a.href);toast('Etiqueta demo descargada.')}
function shareTracking(){const t=`Seguimiento demo AEX: ${ship.code} · ${location.href.split('#')[0]}#track?code=${encodeURIComponent(ship.code)}`;navigator.clipboard?.writeText(t).then(()=>toast('Seguimiento copiado para compartir.')).catch(()=>toast('Código listo para compartir.'))}

function tracking(){const code=parse().qs.get('code')||safeStorage.get(LS_LAST)||'';return `${routeHeader('Tracking','Seguí el envío con contexto, no solo con un estado.','Probá el seguimiento con una guía demo o consultá un envío creado durante esta sesión.')}<section class="section" style="padding-top:30px"><div class="container track-shell"><div class="track-search"><div class="track-search-row"><div class="field"><label>Número de guía</label><input class="input" id="trackCode" value="${escapeHtml(code)}" placeholder="Ej.: AEX-458291"></div><button class="btn btn-primary" id="trackBtn">${icon('search')}Rastrear</button><button class="btn btn-outline" id="demoCode">Usar guía demo</button></div><div id="trackOut">${code?trackingResult(code):''}</div></div></div></section>`}
function trackingResult(code){const s=getShipments().find(x=>x.id.toLowerCase()===String(code).toLowerCase());if(!s)return `<div class="empty-state" style="margin-top:18px;min-height:190px"><div><div>${icon('track')}</div><h3>No encontramos esa guía en la demo.</h3><p>Usá AEX-458291 o creá un envío para verlo reflejado aquí.</p></div></div>`;const steps=['Solicitud creada','Paquete recibido','Centro de clasificación','En tránsito','En distribución','Entregado'];let idx={Creado:0,Recibido:1,'En clasificación':2,'En tránsito':3,'En distribución':4,Entregado:5,Incidencia:3}[s.status]??0;return `<div class="tracking-result"><div class="tracking-head"><div><span class="kicker" style="color:#70d6f1">${s.id}</span><h2>${s.status.toUpperCase()}</h2><p>${escapeHtml(s.origin)} → ${escapeHtml(s.destination)}</p></div><span class="status-pill transit">${s.status}</span></div><div class="tracking-body"><div class="tracking-summary"><div class="tracking-stat"><span>Última actualización</span><b>${s.date} · ${s.updated}</b></div><div class="tracking-stat"><span>Última ubicación</span><b>${idx>=3?'Centro logístico · demo':s.origin}</b></div><div class="tracking-stat"><span>Modalidad</span><b>${escapeHtml(s.service)}</b></div><div class="tracking-stat"><span>Destinatario</span><b>${escapeHtml((s.recipient||'Destinatario').slice(0,1)+'. '+(s.recipient||'').split(' ').slice(-1)[0])}</b></div></div><div class="tracking-timeline">${steps.map((x,i)=>`<div class="t-event ${i<idx?'done':i===idx?'current':''}">${x}</div>`).join('')}</div>${s.issue?`<div class="address-note" style="border-left-color:#c95555;background:#fff4f4;color:#914343"><strong>Incidencia:</strong> ${escapeHtml(s.notes?.[0]||'La operación requiere revisión.')}</div>`:''}</div></div>`}
function bindTracking(){if($('#demoCode'))$('#demoCode').onclick=()=>{$('#trackCode').value='AEX-458291';runTrack()};if($('#trackBtn'))$('#trackBtn').onclick=runTrack}
function runTrack(){const c=$('#trackCode').value.trim();if(!c){toast('Ingresá un número de guía.','warn');return}$('#trackOut').innerHTML='<div class="loading-line" style="margin-top:18px"><i></i></div>';setTimeout(()=>{$('#trackOut').innerHTML=trackingResult(c)},520)}

function points(){const q=parse().qs.get('q')||'';return `${routeHeader('Puntos AEX','Encontrá el punto que mejor encaja con tu recorrido.','Una representación cartográfica conceptual con ubicaciones públicas cargadas para la demo.')}<section class="section" style="padding-top:30px"><div class="container"><div class="points-toolbar"><input class="input" id="pointSearch" value="${escapeHtml(q)}" placeholder="Buscar ciudad o zona"><div class="filter-tabs"><button class="filter-tab active" data-point-filter="Todos">Todos</button><button class="filter-tab" data-point-filter="Agencia">Agencias</button><button class="filter-tab" data-point-filter="Punto AEX">Puntos AEX</button><button class="filter-tab" data-point-filter="eLocker">eLocker</button></div></div><div class="map-layout"><div class="carto"><svg viewBox="0 0 700 480" preserveAspectRatio="none" aria-hidden="true"><rect width="700" height="480" fill="#e9f0f4"/><g fill="none" stroke="#d4e0e6" stroke-width="8"><path d="M-50 130 C140 100 220 180 410 130 S650 100 760 160"/><path d="M-20 330 C110 250 260 300 380 260 S580 230 750 290"/><path d="M180 -30 C150 120 210 230 150 520"/><path d="M520 -20 C500 100 550 210 500 500"/></g><g fill="none" stroke="#f8fbfc" stroke-width="3"><path d="M-50 130 C140 100 220 180 410 130 S650 100 760 160"/><path d="M-20 330 C110 250 260 300 380 260 S580 230 750 290"/><path d="M180 -30 C150 120 210 230 150 520"/><path d="M520 -20 C500 100 550 210 500 500"/></g><g fill="#dce8de"><path d="M40 40h130v70H40z"/><path d="M390 300h190v90H390z"/></g></svg>${pointDirectory.map((p,i)=>`<button class="map-pin" data-point-index="${i}" style="left:${p.x}%;top:${p.y}%" aria-label="${escapeHtml(p.name)}"><i></i></button>`).join('')}</div><div class="point-list" id="pointList">${pointCards(pointDirectory)}</div></div></div></section>`}
function pointCards(list){return list.map((p,i)=>`<article class="point-card" data-point-card="${i}"><span class="kicker">${p.type}</span><h3>${escapeHtml(p.name)}</h3><p><strong>${escapeHtml(p.city)}</strong> · ${escapeHtml(p.address)}</p><p>${escapeHtml(p.hours)}</p><p>${escapeHtml(p.services)}</p><div class="point-actions"><a class="btn btn-soft btn-sm" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.query)}">${icon('pin')}Cómo llegar</a></div></article>`).join('')||`<div class="empty-state"><div>${icon('pin')}<h3>No encontramos puntos.</h3><p>Probá otra ciudad o limpiá los filtros.</p></div></div>`}
function bindPoints(){let filter='Todos';const apply=()=>{const q=$('#pointSearch').value.trim().toLowerCase();const arr=pointDirectory.filter(p=>(filter==='Todos'||p.type===filter)&&(!q||(p.city+' '+p.name+' '+p.address).toLowerCase().includes(q)));$('#pointList').innerHTML=pointCards(arr)};$('#pointSearch').oninput=apply;$$('[data-point-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.pointFilter;$$('[data-point-filter]').forEach(x=>x.classList.toggle('active',x===b));apply()});$$('[data-point-index]').forEach(b=>b.onclick=()=>{const p=pointDirectory[+b.dataset.pointIndex];$('#pointSearch').value=p.city;apply()})}

function business(){return `${routeHeader('Soluciones para empresas','Una entrada comercial que entiende primero la operación.','El diagnóstico transforma una necesidad logística en una solicitud estructurada para el equipo comercial.')}<section class="section" style="padding-top:28px"><div class="container"><div class="b2b-solutions">${[['E-commerce','Automatizá pedidos y despachos.','box'],['Distribución','Centralizá múltiples destinos y operaciones.','truck'],['Fulfillment / almacenamiento','Preparación, gestión y distribución.','warehouse'],['Integración','Conectá tu ecommerce, ERP o sistema con AEX.','link']].map(x=>`<button class="b2b-card" data-solution="${x[0]}"><div class="b2b-icon">${icon(x[2])}</div><h3>${x[0]}</h3><p>${x[1]}</p></button>`).join('')}</div><div class="business-flow" id="businessFlow">${businessStep()}</div></div></section>`}
function businessStep(){if(bizStep===1)return `<span class="kicker">Diagnóstico</span><h2 style="font-size:32px">¿Qué necesita tu operación?</h2><p class="muted">Seleccioná la solución que más se acerca a tu necesidad.</p><div class="business-options">${['Automatizar pedidos y despachos','Centralizar múltiples destinos','Almacenamiento + distribución','Integrar sistemas','Solución personalizada'].map(v=>`<button class="biz-option ${biz.need===v?'selected':''}" data-biz-need="${v}">${v}</button>`).join('')}</div><div class="modal-actions"><button class="btn btn-primary" id="bizNext">Continuar</button></div>`;if(bizStep===2)return `<span class="kicker">Operación</span><h2 style="font-size:32px">Dimensionemos la necesidad.</h2><div class="field-grid"><div class="field"><label>Volumen aproximado</label><select class="select" id="bizVolume">${['1–50 / mes','51–200 / mes','201–500 / mes','501–1.000 / mes','+1.000 / mes','A definir'].map(v=>`<option ${biz.volume===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Canal</label><select class="select" id="bizChannel">${['Tienda propia','Shopify','WooCommerce','Marketplace','Redes sociales','Otro'].map(v=>`<option ${biz.channel===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Gestión actual</label><select class="select" id="bizManagement">${['Manual','Planilla','Sistema propio','Integración/API','Otro'].map(v=>`<option ${biz.management===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Cobertura</label><select class="select" id="bizCoverage">${['Asunción y Central','Nacional','Internacional','Múltiples destinos'].map(v=>`<option ${biz.coverage===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="modal-actions"><button class="btn btn-outline" id="bizPrev">Atrás</button><button class="btn btn-primary" id="bizNext">Continuar</button></div>`;if(bizStep===3)return `<span class="kicker">Contacto</span><h2 style="font-size:32px">¿Con quién debería continuar AEX?</h2><div class="field-grid"><div class="field"><label>Empresa</label><input class="input" id="bizCompany" value="${escapeHtml(biz.company)}"></div><div class="field"><label>Nombre</label><input class="input" id="bizName" value="${escapeHtml(biz.name)}"></div><div class="field"><label>Email</label><input class="input" id="bizEmail" value="${escapeHtml(biz.email)}"></div><div class="field"><label>Teléfono</label><input class="input" id="bizPhone" value="${escapeHtml(biz.phone)}"></div><div class="field full"><label>Comentarios</label><textarea class="textarea" id="bizComments">${escapeHtml(biz.comments)}</textarea></div></div><div class="modal-actions"><button class="btn btn-outline" id="bizPrev">Atrás</button><button class="btn btn-primary" id="bizSubmit">Solicitar propuesta</button></div>`;return `<div class="business-success"><div class="success-mark">${icon('check')}</div><span class="kicker">Solicitud recibida</span><h2 style="font-size:32px">AEX-B2B-${String(50+getLeads().length).padStart(4,'0')}</h2><p class="muted">${escapeHtml(biz.company)} · ${escapeHtml(biz.solution)} · ${escapeHtml(biz.volume)}</p><div class="confirm-actions"><button class="btn btn-primary" id="scheduleContact">Agendar contacto</button><button class="btn btn-outline" data-route="panel">Ver en Control Tower</button></div></div>`}
function bindBusiness(){$$('[data-solution]').forEach(b=>b.onclick=()=>{biz.solution=b.dataset.solution;biz.need={'E-commerce':'Automatizar pedidos y despachos','Distribución':'Centralizar múltiples destinos','Fulfillment / almacenamiento':'Almacenamiento + distribución','Integración':'Integrar sistemas'}[biz.solution]||biz.need;bizStep=1;render()});$$('[data-biz-need]').forEach(b=>b.onclick=()=>{biz.need=b.dataset.bizNeed;render()});if($('#bizPrev'))$('#bizPrev').onclick=()=>{captureBiz();bizStep--;render()};if($('#bizNext'))$('#bizNext').onclick=()=>{captureBiz();bizStep++;render()};if($('#bizSubmit'))$('#bizSubmit').onclick=()=>{captureBiz();if(!biz.company||!biz.name||!biz.email){toast('Completá Empresa, Nombre y Email.','warn');return}const arr=getLeads();const id='AEX-B2B-'+String(50+arr.length).padStart(4,'0');arr.unshift({id,company:biz.company,contact:biz.name,need:biz.solution,volume:biz.volume,status:'Nueva',owner:'Sin asignar',date:new Intl.DateTimeFormat('es-PY').format(new Date()),phone:biz.phone,email:biz.email,notes:biz.comments?[biz.comments]:[]});saveLeads(arr);selectedLead=id;bizStep=4;toast('Solicitud recibida.');render()};if($('#scheduleContact'))$('#scheduleContact').onclick=()=>toast('Contacto demo agendado para seguimiento comercial.')}
function captureBiz(){const m={bizVolume:'volume',bizChannel:'channel',bizManagement:'management',bizCoverage:'coverage',bizCompany:'company',bizName:'name',bizEmail:'email',bizPhone:'phone',bizComments:'comments'};Object.entries(m).forEach(([id,k])=>{const e=$('#'+id);if(e)biz[k]=e.value})}

function account(){return `<section class="account-shell"><div class="container"><div class="account-top"><div><span class="kicker">Mi cuenta</span><h2 style="font-size:34px;margin-bottom:2px">Portal del cliente</h2><p class="muted" style="margin:0">Una experiencia posterior al envío.</p></div><button class="btn btn-primary" data-route="send">Crear envío</button></div><div class="account-grid"><nav class="account-nav">${[['shipments','Mis envíos'],['quotes','Cotizaciones'],['addresses','Direcciones'],['recipients','Destinatarios'],['billing','Facturación'],['support','Soporte']].map(([k,v])=>`<button class="${accountTab===k?'active':''}" data-account-tab="${k}">${v}</button>`).join('')}</nav><div class="account-content">${accountContent()}</div></div></div></section>`}
function accountContent(){if(accountTab==='shipments')return `<h3>Mis envíos</h3><div class="shipment-list">${getShipments().slice(0,6).map(s=>`<div class="shipment-row"><code>${s.id}</code><div><strong>${s.destination}</strong><br><small>${s.date} · ${s.service}</small></div><span class="status-pill ${s.status==='Entregado'?'done':'transit'}">${s.status}</span><small>${s.weight}</small><button class="btn btn-soft btn-sm" data-track-code="${s.id}">Seguimiento</button></div>`).join('')}</div>`;const map={quotes:['quote','Cotizaciones','Guardá y retomá cotizaciones preparadas para el motor tarifario.'],addresses:['pin','Direcciones','Administrá ubicaciones frecuentes con referencias útiles para reparto.'],recipients:['users','Destinatarios','Reutilizá datos de destinatarios habituales.'],billing:['quote','Facturación','Un espacio preparado para documentos y métodos de pago.'],support:['alert','Soporte','Centralizá consultas vinculadas a una guía o envío.']};const [ico,t,c]=map[accountTab];return `<div class="account-placeholder"><div>${icon(ico)}<h3>${t}</h3><p>${c}</p></div></div>`}
function bindAccount(){$$('[data-account-tab]').forEach(b=>b.onclick=()=>{accountTab=b.dataset.accountTab;render()});$$('[data-track-code]').forEach(b=>b.onclick=()=>go('track','code='+b.dataset.trackCode))}

function panelNav(){const groups=[['RESUMEN',[['dashboard','Dashboard','home']]],['OPERACIÓN',[['shipments','Envíos','box'],['tracking','Tracking','track'],['incidents','Incidencias','alert']]],['COMERCIAL',[['leads','Solicitudes','quote'],['companies','Empresas','building']]],['GESTIÓN',[['clients','Clientes','users'],['reports','Reportes','chart']]],['SISTEMA',[['users','Usuarios','user'],['settings','Configuración','settings']]]];return groups.map(([lab,items])=>`<div class="control-group"><div class="control-group-label">${lab}</div>${items.map(([k,v,i])=>`<button class="control-nav-btn ${panelSection===k?'active':''}" data-panel-section="${k}">${icon(i)}<span>${v}</span></button>`).join('')}</div>`).join('')}

function panelHeading(title,copy,actions=''){return `<div class="control-heading"><div><span class="kicker">AEX Control Tower</span><h1>${title}</h1><p>${copy}</p></div><div class="module-tools">${actions}</div></div>`}
function panelContent(){if(panelSection==='dashboard')return dashboard();if(panelSection==='shipments')return shipmentsModule();if(panelSection==='tracking')return trackingPanel();if(panelSection==='incidents')return incidentsModule();if(panelSection==='leads')return leadsModule();if(panelSection==='companies')return companiesModule();if(panelSection==='clients')return clientsModule();if(panelSection==='reports')return reportsModule();if(panelSection==='users')return usersModule();return settingsModule()}
function dashboard(){const sh=getShipments();const active=47, pending=6, incidents=3, ontime='92%';return `${panelHeading('Dashboard','Visión operativa concentrada en lo que requiere atención.',`<button class="btn btn-outline btn-sm" id="panelRefresh">Actualizar</button>`)}<div class="control-kpis"><div class="kpi"><span>Envíos activos</span><strong>${active}</strong><small>Dato demostrativo</small></div><div class="kpi"><span>Pendientes</span><strong>${pending}</strong><small>Dato demostrativo</small></div><div class="kpi"><span>Incidencias</span><strong>${incidents}</strong><small>Dato demostrativo</small></div><div class="kpi"><span>Entregas a tiempo</span><strong>${ontime}</strong><small>Dato demostrativo</small></div></div><div class="control-grid"><section class="control-card"><div class="card-head"><div><small>OPERACIÓN</small><h3>Envíos recientes</h3></div><button class="btn btn-soft btn-sm" data-panel-jump="shipments">Ver envíos</button></div><table class="ops-table"><thead><tr><th>Guía</th><th>Ruta</th><th>Estado</th><th>Responsable</th></tr></thead><tbody>${sh.slice(0,5).map(s=>`<tr data-open-shipment="${s.id}"><td><strong>${s.id}</strong><br><small>${escapeHtml(s.customer)}</small></td><td>${escapeHtml(s.origin)} → ${escapeHtml(s.destination)}</td><td>${statusBadge(s.status)}</td><td>${escapeHtml(s.owner)}</td></tr>`).join('')}</tbody></table></section><aside class="control-card"><div class="card-head"><div><small>PRIORIDAD</small><h3>Requieren atención</h3></div></div><div class="attention-list"><div class="attention-row"><div class="attention-icon">${icon('alert')}</div><div><strong>Incidencias abiertas</strong><p>Operaciones con excepción registrada.</p></div><span class="count">3</span></div><div class="attention-row"><div class="attention-icon" style="background:#eaf8fd;color:#0786b1">${icon('user')}</div><div><strong>Sin responsable</strong><p>Envíos pendientes de asignación.</p></div><span class="count">2</span></div><div class="attention-row"><div class="attention-icon" style="background:#eef5ff;color:#3f70c9">${icon('truck')}</div><div><strong>En distribución</strong><p>Seguimiento de última milla.</p></div><span class="count">4</span></div></div></aside></div>`}
function shipmentsModule(){const all=getShipments();let arr=all.filter(s=>shipStatusFilter==='Todos'||s.status===shipStatusFilter);if(tableSort==='date-desc')arr=arr.slice().reverse();const selected=all.find(s=>s.id===selectedShipment);return `${panelHeading('Envíos','Estados logísticos separados de la gestión comercial.',`<button class="btn btn-outline btn-sm" id="exportShipments">${icon('download')}Exportar CSV</button><button class="btn btn-primary btn-sm" data-route="send">${icon('plus')}Crear envío</button>`)}<div class="module-toolbar"><div class="module-tools"><input class="input" id="shipmentSearch" placeholder="Buscar guía, nombre o ciudad"><select class="select" id="shipmentStatus"><option>Todos</option>${['Creado','Recibido','En clasificación','En tránsito','En distribución','Entregado','Incidencia'].map(x=>`<option ${shipStatusFilter===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn btn-outline btn-sm" id="sortShipments">${icon('sort')}Ordenar</button></div></div><div class="module-layout"><div class="table-card"><table class="data-table" id="shipTable"><thead><tr><th>Guía</th><th>Cliente</th><th>Ruta</th><th>Modalidad</th><th>Estado</th><th>Responsable</th><th>Fecha</th></tr></thead><tbody>${arr.map(s=>`<tr data-open-shipment="${s.id}" class="${selected?.id===s.id?'selected':''}"><td><strong>${s.id}</strong></td><td>${escapeHtml(s.customer)}</td><td>${escapeHtml(s.origin)} → ${escapeHtml(s.destination)}</td><td>${escapeHtml(s.service)}</td><td>${statusBadge(s.status)}</td><td>${escapeHtml(s.owner)}</td><td>${s.date}</td></tr>`).join('')}</tbody></table></div>${selected?shipmentDrawer(selected):''}</div>`}
function shipmentDrawer(s){const statuses=['Creado','Recibido','En clasificación','En tránsito','En distribución','Entregado','Incidencia'];return `<aside class="drawer"><div class="drawer-head"><small>${s.id}</small><h3>${escapeHtml(s.customer)}</h3>${statusBadge(s.status)}</div><div class="drawer-body"><div class="detail-grid"><div class="detail"><span>Remitente</span><b>${escapeHtml(s.customer)}</b></div><div class="detail"><span>Destinatario</span><b>${escapeHtml(s.recipient)}</b></div><div class="detail"><span>Origen</span><b>${escapeHtml(s.origin)}</b></div><div class="detail"><span>Destino</span><b>${escapeHtml(s.destination)}</b></div><div class="detail"><span>Modalidad</span><b>${escapeHtml(s.service)}</b></div><div class="detail"><span>Peso</span><b>${escapeHtml(s.weight)}</b></div></div><div class="field" style="margin-top:10px"><label>Estado</label><select class="select" id="drawerShipStatus">${statuses.map(x=>`<option ${x===s.status?'selected':''}>${x}</option>`).join('')}</select></div><div class="field" style="margin-top:8px"><label>Responsable</label><select class="select" id="drawerShipOwner">${['Sin asignar','Operaciones','María López','Supervisor'].map(x=>`<option ${x===s.owner?'selected':''}>${x}</option>`).join('')}</select></div><div class="mini-timeline">${statuses.slice(0,6).map((x,i)=>`<div class="mini-event ${i<statuses.indexOf(s.status)?'done':x===s.status?'current':''}"><strong>${x}</strong></div>`).join('')}</div>${(s.notes||[]).map(n=>`<div class="note">${escapeHtml(n)}</div>`).join('')}<div class="field" style="margin-top:9px"><label>Agregar observación</label><div style="display:flex;gap:6px"><input class="input" id="shipNote" placeholder="Nota interna"><button class="btn btn-dark btn-sm" id="saveShipNote">Guardar</button></div></div></div></aside>`}
function trackingPanel(){return `${panelHeading('Tracking','Consulta rápida desde la operación interna.')}<div class="control-card" style="padding:18px"><div class="track-search-row"><div class="field"><label>Guía</label><input class="input" id="panelTrackCode" value="AEX-458291"></div><button class="btn btn-primary" id="panelTrackBtn">Rastrear</button></div><div id="panelTrackOut">${trackingResult('AEX-458291')}</div></div>`}
function incidentsModule(){const arr=getShipments().filter(x=>x.status==='Incidencia'||x.issue);return `${panelHeading('Incidencias','Excepciones operativas separadas del flujo normal.')}<div class="table-card"><table class="data-table"><thead><tr><th>Guía</th><th>Cliente</th><th>Ruta</th><th>Motivo</th><th>Responsable</th></tr></thead><tbody>${arr.map(s=>`<tr data-open-shipment="${s.id}"><td><strong>${s.id}</strong></td><td>${s.customer}</td><td>${s.origin} → ${s.destination}</td><td>${escapeHtml(s.notes?.[0]||'Requiere revisión')}</td><td>${s.owner}</td></tr>`).join('')}</tbody></table></div>`}
function leadsModule(){const all=getLeads();const arr=all.filter(l=>leadStatusFilter==='Todos'||l.status===leadStatusFilter);const selected=all.find(l=>l.id===selectedLead);return `${panelHeading('Solicitudes comerciales','CRM conceptual separado de los estados logísticos.',`<button class="btn btn-outline btn-sm" id="exportLeads">${icon('download')}Exportar CSV</button>`)}<div class="module-toolbar"><div class="module-tools"><input class="input" id="leadSearch" placeholder="Buscar empresa, contacto o necesidad"><select class="select" id="leadStatus"><option>Todos</option>${['Nueva','Asignada','Contactada','Propuesta','Seguimiento','Ganada','Perdida'].map(x=>`<option ${leadStatusFilter===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="module-layout"><div class="table-card"><table class="data-table"><thead><tr><th>ID</th><th>Empresa</th><th>Contacto</th><th>Necesidad</th><th>Volumen</th><th>Estado</th><th>Responsable</th></tr></thead><tbody>${arr.map(l=>`<tr data-open-lead="${l.id}" class="${selected?.id===l.id?'selected':''}"><td><strong>${l.id}</strong></td><td>${escapeHtml(l.company)}</td><td>${escapeHtml(l.contact)}</td><td>${escapeHtml(l.need)}</td><td>${escapeHtml(l.volume)}</td><td><span class="status-pill transit">${l.status}</span></td><td>${escapeHtml(l.owner)}</td></tr>`).join('')}</tbody></table></div>${selected?leadDrawer(selected):''}</div>`}
function leadDrawer(l){const statuses=['Nueva','Asignada','Contactada','Propuesta','Seguimiento','Ganada','Perdida'];return `<aside class="drawer"><div class="drawer-head"><small>${l.id}</small><h3>${escapeHtml(l.company)}</h3><span class="status-pill transit">${l.status}</span></div><div class="drawer-body"><div class="detail-grid"><div class="detail"><span>Contacto</span><b>${escapeHtml(l.contact)}</b></div><div class="detail"><span>Necesidad</span><b>${escapeHtml(l.need)}</b></div><div class="detail"><span>Volumen</span><b>${escapeHtml(l.volume)}</b></div><div class="detail"><span>Email</span><b>${escapeHtml(l.email)}</b></div></div><div class="field" style="margin-top:10px"><label>Estado comercial</label><select class="select" id="drawerLeadStatus">${statuses.map(x=>`<option ${x===l.status?'selected':''}>${x}</option>`).join('')}</select></div><div class="field" style="margin-top:8px"><label>Responsable</label><select class="select" id="drawerLeadOwner">${['Sin asignar','Equipo Comercial','Laura Benítez','Supervisor'].map(x=>`<option ${x===l.owner?'selected':''}>${x}</option>`).join('')}</select></div>${(l.notes||[]).map(n=>`<div class="note">${escapeHtml(n)}</div>`).join('')}<div class="field" style="margin-top:9px"><label>Nota comercial</label><div style="display:flex;gap:6px"><input class="input" id="leadNote"><button class="btn btn-dark btn-sm" id="saveLeadNote">Guardar</button></div></div></div></aside>`}
function companiesModule(){const leads=getLeads();return `${panelHeading('Empresas','Vista de cuentas comerciales dentro de la demo.')}<div class="panel-cards">${leads.map(l=>`<article class="panel-card"><span class="kicker">${l.status}</span><h3 style="margin-top:13px">${escapeHtml(l.company)}</h3><p>${escapeHtml(l.need)} · ${escapeHtml(l.volume)}</p><button class="btn btn-soft btn-sm" data-company-lead="${l.id}">Abrir solicitud</button></article>`).join('')}</div>`}
function clientsModule(){const sh=getShipments();const names=[...new Set(sh.map(x=>x.customer))];return `${panelHeading('Clientes','Personas y cuentas presentes en los envíos demostrativos.')}<div class="panel-cards">${names.map(n=>`<article class="panel-card"><div class="choice-icon">${icon('user')}</div><h3>${escapeHtml(n)}</h3><p>${sh.filter(x=>x.customer===n).length} envío(s) en la bandeja demo.</p></article>`).join('')}</div>`}
function reportsModule(){return `${panelHeading('Reportes','Indicadores demostrativos para explicar cómo podría escalar la analítica.')}<div class="control-card" style="padding:20px"><div class="report-bars">${[['En tránsito',72],['En distribución',55],['Entregado',88],['Incidencias',18]].map(([n,v])=>`<div class="bar-row"><strong>${n}</strong><div class="bar"><i style="width:${v}%"></i></div><span>${v}%</span></div>`).join('')}</div><p class="helper" style="margin-top:18px">Valores ilustrativos, no métricas reales de AEX.</p></div>`}
function usersModule(){return `${panelHeading('Usuarios','Perfiles conceptuales para mostrar separación de responsabilidades.')}<div class="panel-cards">${[['María López','Operaciones'],['Equipo Comercial','Comercial'],['Supervisor Demo','Supervisor'],['Administrador Demo','Administrador']].map(([n,r])=>`<article class="panel-card"><div class="choice-icon">${icon('user')}</div><h3>${n}</h3><span class="role-chip">${r}</span></article>`).join('')}</div>`}
function settingsModule(){return `${panelHeading('Configuración','Preferencias de la demo, sin afirmar configuraciones reales de AEX.')}<div class="control-card" style="padding:0 18px"><div class="setting-row"><div><strong>Notificaciones operativas</strong><small>Alertas visuales dentro del Control Tower.</small></div><button class="switch on" data-switch></button></div><div class="setting-row"><div><strong>Persistencia local</strong><small>Conservar estados, responsables y notas de la demo.</small></div><button class="switch on" data-switch></button></div><div class="setting-row"><div><strong>Modo compacto</strong><small>Reducir densidad visual en tablas.</small></div><button class="switch" data-switch></button></div></div>`}
function exportCsv(kind){const rows=kind==='shipments'?getShipments().map(s=>[s.id,s.customer,s.origin,s.destination,s.service,s.status,s.owner,s.date]):getLeads().map(l=>[l.id,l.company,l.contact,l.need,l.volume,l.status,l.owner,l.date]);const head=kind==='shipments'?['Código','Cliente','Origen','Destino','Modalidad','Estado','Responsable','Fecha']:['ID','Empresa','Contacto','Necesidad','Volumen','Estado','Responsable','Fecha'];const csv=[head,...rows].map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`AEX_${kind}_demo.csv`;a.click();URL.revokeObjectURL(a.href);toast('CSV exportado.')}

function gfTables(){const exp=new Array(512),log=new Array(256).fill(0);let x=1;for(let i=0;i<255;i++){exp[i]=x;log[x]=i;x<<=1;if(x&0x100)x^=0x11d}for(let i=255;i<512;i++)exp[i]=exp[i-255];return{exp,log}}

function qrMatrix(txt){const version=5,size=37,dataCW=108,eccN=26,bytes=[...new TextEncoder().encode(txt)];if(bytes.length>106)throw new Error('Contenido QR demasiado largo');const bits=[];const push=(v,n)=>{for(let i=n-1;i>=0;i--)bits.push((v>>>i)&1)};push(4,4);push(bytes.length,8);bytes.forEach(b=>push(b,8));const cap=dataCW*8;for(let i=0;i<Math.min(4,cap-bits.length);i++)bits.push(0);while(bits.length%8)bits.push(0);const data=[];for(let i=0;i<bits.length;i+=8){let v=0;for(let j=0;j<8;j++)v=(v<<1)|(bits[i+j]||0);data.push(v)}let pad=0;while(data.length<dataCW)data.push(pad++%2?0x11:0xec);const code=data.concat(rsEncode(data,eccN));const m=Array.from({length:size},()=>Array(size).fill(null));const finder=(r,c)=>{for(let dr=-1;dr<=7;dr++)for(let dc=-1;dc<=7;dc++){const rr=r+dr,cc=c+dc;if(rr<0||rr>=size||cc<0||cc>=size)continue;m[rr][cc]=(dr>=0&&dr<=6&&dc>=0&&dc<=6&&(dr===0||dr===6||dc===0||dc===6||(dr>=2&&dr<=4&&dc>=2&&dc<=4)))}};finder(0,0);finder(size-7,0);finder(0,size-7);const pos=[6,30];for(const r of pos)for(const c of pos){if(m[r][c]!==null)continue;for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++)m[r+dr][c+dc]=Math.max(Math.abs(dr),Math.abs(dc))!==1}for(let i=8;i<size-8;i++){if(m[i][6]===null)m[i][6]=i%2===0;if(m[6][i]===null)m[6][i]=i%2===0}const mask=0,info=bchTypeInfo((1<<3)|mask);for(let i=0;i<15;i++){const mod=((info>>i)&1)===1;if(i<6)m[i][8]=mod;else if(i<8)m[i+1][8]=mod;else m[size-15+i][8]=mod;if(i<8)m[8][size-i-1]=mod;else if(i<9)m[8][15-i]=mod;else m[8][15-i-1]=mod}m[size-8][8]=true;let inc=-1,row=size-1,byte=0,bit=7;for(let col=size-1;col>0;col-=2){if(col===6)col--;while(true){for(let c=0;c<2;c++)if(m[row][col-c]===null){let dark=byte<code.length?(((code[byte]>>>bit)&1)===1):false;if((row+col-c)%2===0)dark=!dark;m[row][col-c]=dark;if(--bit<0){byte++;bit=7}}row+=inc;if(row<0||row>=size){row-=inc;inc=-inc;break}}}return m}

function searchAll(q){const term=q.trim().toLowerCase();if(term.length<2)return[];const shipments=getShipments().filter(s=>[s.id,s.customer,s.recipient,s.origin,s.destination,s.status,s.service,s.owner,s.originDetail,s.destinationDetail].some(v=>String(v||'').toLowerCase().includes(term))).slice(0,6).map(s=>({type:'shipment',id:s.id,title:s.id,sub:`${s.origin} → ${s.destination}`,meta:s.status,icon:'box'}));const leads=getLeads().filter(l=>[l.id,l.company,l.contact,l.email,l.need,l.status,l.owner].some(v=>String(v||'').toLowerCase().includes(term))).slice(0,5).map(l=>({type:'lead',id:l.id,title:l.company,sub:`${l.id} · ${l.need}`,meta:l.status,icon:'quote'}));const clients=[];const seen=new Set();for(const s of getShipments()){for(const name of [s.customer,s.recipient])if(name&&!seen.has(name)&&[name,s.senderPhone,s.recipientPhone,s.origin,s.destination].some(v=>String(v||'').toLowerCase().includes(term))){seen.add(name);clients.push({type:'client',id:s.id,title:name,sub:'Cliente presente en envíos demo',meta:'Cliente',icon:'user'})}}return[...shipments,...leads,...clients.slice(0,4)]}
function renderGlobalResults(q){const box=$('#globalSearchResults'),input=$('#globalPanelSearch');if(!box||!input)return;globalSearchItems=searchAll(q);globalSearchIndex=-1;if(q.trim().length<2){box.classList.add('hidden');input.setAttribute('aria-expanded','false');return}if(!globalSearchItems.length){box.innerHTML=`<div class="search-empty">No encontramos resultados para “${escapeHtml(q)}”.</div>`;box.classList.remove('hidden');input.setAttribute('aria-expanded','true');return}const groups=[['shipment','Envíos'],['lead','Solicitudes'],['client','Clientes']];box.innerHTML=groups.map(([type,label])=>{const items=globalSearchItems.map((it,i)=>({...it,index:i})).filter(it=>it.type===type);return items.length?`<div class="search-group-title">${label}</div>${items.map(it=>`<button class="search-result" role="option" id="search-opt-${it.index}" data-search-index="${it.index}"><span class="sr-icon">${icon(it.icon)}</span><span><strong>${escapeHtml(it.title)}</strong><small>${escapeHtml(it.sub)}</small></span><span class="sr-status">${escapeHtml(it.meta)}</span></button>`).join('')}`:''}).join('');box.classList.remove('hidden');input.setAttribute('aria-expanded','true');$$('[data-search-index]',box).forEach(b=>b.onclick=()=>openGlobalResult(+b.dataset.searchIndex))}
function openGlobalResult(i){const it=globalSearchItems[i];if(!it)return;if(it.type==='shipment'||it.type==='client'){selectedShipment=it.id;panelSection='shipments'}else{selectedLead=it.id;panelSection='leads'}render()}
function bindGlobalSearch(){const input=$('#globalPanelSearch'),box=$('#globalSearchResults');if(!input||!box)return;input.oninput=e=>{clearTimeout(globalSearchTimer);globalSearchTimer=setTimeout(()=>renderGlobalResults(e.target.value),180)};input.onkeydown=e=>{if(box.classList.contains('hidden'))return;if(e.key==='Escape'){box.classList.add('hidden');input.setAttribute('aria-expanded','false');return}if(!globalSearchItems.length)return;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();globalSearchIndex=(globalSearchIndex+(e.key==='ArrowDown'?1:-1)+globalSearchItems.length)%globalSearchItems.length;$$('.search-result',box).forEach((el,j)=>el.classList.toggle('active',j===globalSearchIndex));$('#search-opt-'+globalSearchIndex)?.scrollIntoView({block:'nearest'})}else if(e.key==='Enter'&&globalSearchIndex>=0){e.preventDefault();openGlobalResult(globalSearchIndex)}};input.onblur=()=>setTimeout(()=>{box.classList.add('hidden');input.setAttribute('aria-expanded','false')},180)}
function bindPanel(){$$('[data-panel-section]').forEach(b=>b.onclick=()=>{panelSection=b.dataset.panelSection;selectedShipment='';selectedLead='';render()});$$('[data-panel-jump]').forEach(b=>b.onclick=()=>{panelSection=b.dataset.panelJump;render()});$$('[data-open-shipment]').forEach(b=>b.onclick=()=>{selectedShipment=b.dataset.openShipment;panelSection='shipments';render()});$$('[data-open-lead]').forEach(b=>b.onclick=()=>{selectedLead=b.dataset.openLead;panelSection='leads';render()});$$('[data-company-lead]').forEach(b=>b.onclick=()=>{selectedLead=b.dataset.companyLead;panelSection='leads';render()});if($('#shipmentStatus'))$('#shipmentStatus').onchange=e=>{shipStatusFilter=e.target.value;render()};if($('#leadStatus'))$('#leadStatus').onchange=e=>{leadStatusFilter=e.target.value;render()};if($('#sortShipments'))$('#sortShipments').onclick=()=>{tableSort=tableSort==='date-desc'?'date-asc':'date-desc';render()};if($('#exportShipments'))$('#exportShipments').onclick=()=>exportCsv('shipments');if($('#exportLeads'))$('#exportLeads').onclick=()=>exportCsv('leads');if($('#drawerShipStatus'))$('#drawerShipStatus').onchange=e=>updateShipment(selectedShipment,{status:e.target.value,issue:e.target.value==='Incidencia'});if($('#drawerShipOwner'))$('#drawerShipOwner').onchange=e=>updateShipment(selectedShipment,{owner:e.target.value});if($('#saveShipNote'))$('#saveShipNote').onclick=()=>{const v=$('#shipNote').value.trim();if(v)updateShipment(selectedShipment,{notes:[...(getShipments().find(x=>x.id===selectedShipment)?.notes||[]),v]},'Nota guardada.')};if($('#drawerLeadStatus'))$('#drawerLeadStatus').onchange=e=>updateLead(selectedLead,{status:e.target.value});if($('#drawerLeadOwner'))$('#drawerLeadOwner').onchange=e=>updateLead(selectedLead,{owner:e.target.value});if($('#saveLeadNote'))$('#saveLeadNote').onclick=()=>{const v=$('#leadNote').value.trim();if(v)updateLead(selectedLead,{notes:[...(getLeads().find(x=>x.id===selectedLead)?.notes||[]),v]},'Nota guardada.')};if($('#panelTrackBtn'))$('#panelTrackBtn').onclick=()=>{$('#panelTrackOut').innerHTML=trackingResult($('#panelTrackCode').value.trim())};if($('#panelRefresh'))$('#panelRefresh').onclick=()=>{const b=$('#panelRefresh');b.disabled=true;b.innerHTML=`${icon('refresh')}Actualizando…`;setTimeout(()=>{dashboardUpdatedAt=new Date().toLocaleTimeString('es-PY',{hour:'2-digit',minute:'2-digit'});render();toast('Dashboard actualizado.')},420)};if($('#shipmentSearch'))$('#shipmentSearch').oninput=e=>filterRows(e.target.value,'.data-table');if($('#leadSearch'))$('#leadSearch').oninput=e=>filterRows(e.target.value,'.data-table');$$('[data-switch]').forEach(b=>b.onclick=()=>b.classList.toggle('on'));if($('#resetDemo'))$('#resetDemo').onclick=showResetModal;if($('#panelBell'))$('#panelBell').onclick=()=>{const k=dashboardStats();showModal(`<div class="modal-head"><h3>Alertas operativas</h3><button class="modal-close" data-close-modal>${icon('x')}</button></div><div class="attention-list"><div class="attention-row"><div class="attention-icon">${icon('alert')}</div><div><strong>${k.incidents} incidencia(s)</strong><p>Casos con estado Incidencia.</p></div></div><div class="attention-row"><div class="attention-icon" style="background:#eaf8fd;color:#0786b1">${icon('user')}</div><div><strong>${getShipments().filter(s=>s.owner==='Sin asignar').length} sin asignar</strong><p>Operaciones pendientes de responsable.</p></div></div></div>`)};bindGlobalSearch()}

function closing(){return `<section class="closing-band" style="min-height:calc(100vh - 28px);display:grid;align-items:center"><div class="container"><span class="kicker" style="color:#70d5f1">Visión conectada</span><h1 style="color:#fff;max-width:900px">Una experiencia AEX conectada de punta a punta.</h1><p class="lead" style="color:#b9d0d9">Más que un rediseño visual: una experiencia digital pensada para conectar al cliente con la operación.</p><div class="closing-grid"><div class="closing-col"><span>Cliente</span><strong>Cotiza<br>Crea<br>Paga<br>Rastrea</strong></div><div class="closing-col"><span>Empresa</span><strong>Integra<br>Automatiza<br>Distribuye</strong></div><div class="closing-col"><span>AEX</span><strong>Centraliza<br>Prioriza<br>Monitorea</strong></div></div><div class="hero-actions"><button class="btn btn-primary" data-route="home">Volver al inicio</button><button class="btn btn-outline" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.2)" data-route="panel">Explorar Control Tower</button></div><p style="margin-top:32px;color:#7295a4;font-size:11px">Concepto desarrollado por EVERJSON.</p></div></section>`}

function bindCommon(){$$('[data-route]').forEach(b=>b.onclick=()=>{go(b.dataset.route);$('#mobileNav')?.classList.add('hidden')});const mobile=$('#mobileMenu');if(mobile)mobile.onclick=()=>$('#mobileNav').classList.toggle('hidden')}
function setNavActive(route){$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.route===route))}
function render(){const{route}=parse();document.body.classList.toggle('panel-mode',route==='panel');$('#siteFooter').style.display=route==='panel'||route==='closing'?'none':'';setNavActive(route);const views={home,send:()=>wizard(false),quote:()=>wizard(true),track:tracking,points,business,login,account,panel,closing};$('#app').innerHTML=(views[route]||home)();bindCommon();if(route==='send'||route==='quote')bindWizard();if(route==='track')bindTracking();if(route==='points')bindPoints();if(route==='business')bindBusiness();if(route==='login')bindLogin();if(route==='account')bindAccount();if(route==='panel')bindPanel();window.scrollTo({top:0,behavior:'auto'})}
function resetPresentation(){safeStorage.set('presentation-hidden','0');$('#presentation')?.classList.remove('hidden');$('#showPresentation')?.classList.add('hidden')}
$('#hidePresentation').onclick=()=>{safeStorage.set('presentation-hidden','1');$('#presentation').classList.add('hidden');$('#showPresentation').classList.remove('hidden')};$('#showPresentation').onclick=resetPresentation;if(safeStorage.get('presentation-hidden')==='1'){$('#presentation').classList.add('hidden');$('#showPresentation').classList.remove('hidden')}setIconButtons();window.addEventListener('hashchange',render);render();
</script>
</body></html>
