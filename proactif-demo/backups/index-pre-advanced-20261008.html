*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{background:linear-gradient(180deg,var(--navy),#202052);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;margin:0 4px 16px;padding:10px 8px 8px;background:transparent;border:none;border-radius:0;box-shadow:none}.brand img{display:block;width:min(190px,100%);height:auto;max-height:76px;object-fit:contain;filter:drop-shadow(0 2px 8px rgba(0,0,0,.18)) drop-shadow(0 0 1px rgba(255,255,255,.18))}.brand .brand-demo{font-size:9px;line-height:1;letter-spacing:.12em;font-weight:800;color:#fff;text-transform:uppercase;text-shadow:0 1px 2px rgba(0,0,0,.35)}.brand-logo{display:block;width:100%;max-width:205px;height:auto;margin:0 auto 14px;background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;filter:drop-shadow(0 3px 8px rgba(0,0,0,.22))}.brand-logo::before,.brand-logo::after{display:none!important}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#dce3ff;border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer}.nav button.active,.nav button:hover{background:rgba(255,255,255,.12);color:#fff}.side-note{font-size:10px;line-height:1.45;color:#cbd3ff;border-top:1px solid rgba(255,255,255,.14);margin-top:16px;padding:14px 8px}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}.top b{font-size:16px}.top small{display:block;color:var(--muted);margin-top:2px}.badge{font-size:10px;font-weight:800;color:var(--navy);background:#ececff;border:1px solid #d7d6ff;padding:6px 8px;border-radius:999px}.content{padding:22px;max-width:1500px;margin:auto}.view{display:none}.view.active{display:block}.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:16px}.hero h1{margin:0;font-size:27px}.hero p{margin:7px 0 0;color:var(--muted);font-size:12px;max-width:760px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px;font-weight:700;font-size:12px;cursor:pointer}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.sky{background:var(--sky);border-color:var(--sky)}.btn.small{padding:7px 9px;font-size:11px}.btn:disabled{opacity:.45;cursor:not-allowed}.action-stack{display:grid;gap:6px;min-width:170px}.action-stack .btn{width:100%}.action-select{min-width:190px}.field-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.field-head label{margin:0}.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(6,1fr);margin-bottom:12px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 26px rgba(25,42,70,.06)}.kpi{padding:14px}.kpi label{display:block;font-size:9px;text-transform:uppercase;color:var(--muted);font-weight:800}.kpi strong{display:block;font-size:25px;margin-top:6px}.split{grid-template-columns:1.25fr .75fr}.panel{padding:16px}.panel h2{font-size:15px;margin:0 0 12px}.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.flow button{appearance:none;border:1px solid #cfe0ec;background:linear-gradient(180deg,#fff,#f4f9fc);color:var(--ink);font-size:10px;font-weight:800;text-align:center;padding:11px 7px;border-radius:10px;cursor:pointer;transition:.16s ease;box-shadow:0 1px 0 rgba(255,255,255,.8) inset}.flow button:hover{border-color:var(--sky);background:#eef8fd;transform:translateY(-1px);box-shadow:0 5px 14px rgba(39,106,171,.12)}.flow button:focus-visible{outline:3px solid rgba(74,168,223,.28);outline-offset:2px}.flow button span{display:block;font-size:9px;color:var(--muted);font-weight:700;margin-top:3px}.alert{border:1px solid var(--line);border-left:4px solid var(--sky);border-radius:10px;padding:10px 11px;margin-top:8px}.alert.warn{border-left-color:#f59e0b}.alert.red{border-left-color:#ef4444}.alert b{font-size:11px}.alert p{font-size:10px;color:var(--muted);margin:3px 0 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}.input{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 10px;font-size:12px}.table{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:10px 11px;border-bottom:1px solid #edf1f5;text-align:left;font-size:11px}th{font-size:9px;text-transform:uppercase;color:var(--muted);background:#f8fafc}.status{display:inline-block;border-radius:999px;padding:4px 7px;font-size:9px;font-weight:800;background:#eef2f6}.status.ok{background:#e9f8f1;color:#087453}.status.warn{background:#fff4e5;color:#9a5a00}.status.blue{background:#eaf4ff;color:#1b5c94}.status.red{background:#feeceb;color:#b42318}.clients{display:grid;gap:10px}.client{padding:14px;display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center}.client h3{font-size:13px;margin:0 0 3px}.client p{font-size:10px;color:var(--muted);margin:0}.pills{display:flex;gap:5px;flex-wrap:wrap}.pill{font-size:9px;border:1px solid var(--line);border-radius:999px;padding:4px 7px}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.product{padding:13px}.product small{font-size:9px;color:var(--blue);font-weight:800;text-transform:uppercase}.product h3{font-size:12px;margin:6px 0 4px}.product p{font-size:10px;color:var(--muted);margin:0}.code{font-size:9px;background:#f3f7fb;padding:4px 6px;border-radius:6px;display:inline-block;margin-top:7px}.note{border:1px dashed #9fcde5;background:#f0f9fd;color:#36566d;padding:9px 11px;border-radius:10px;font-size:10px;margin-bottom:12px}.modalback{display:none;position:fixed;inset:0;background:rgba(10,16,31,.55);z-index:50;padding:12px;align-items:center;justify-content:center}.modalback.open{display:flex}.modal{width:min(700px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:16px}.modalhead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modalbody{padding:16px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:10px;font-weight:700}.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:9px}.modalfoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:7px}.toast{position:fixed;right:18px;bottom:18px;background:#152238;color:#fff;padding:10px 12px;border-radius:9px;font-size:11px;opacity:0;transform:translateY(15px);transition:.2s}.toast.show{opacity:1;transform:none}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.products{grid-template-columns:repeat(3,1fr)}}@media(max-width:850px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.nav{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.client{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.content{padding:12px}.top{padding:0 12px}.hero{flex-direction:column;align-items:flex-start}.hero h1{font-size:22px}.kpis{grid-template-columns:repeat(2,1fr)}.flow{grid-template-columns:repeat(2,1fr)}.products{grid-template-columns:1fr}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.badge{display:none}}
</style>

<body>
<div class="app">
<aside class="side">
<img class="brand-logo" src="logo.svg?v=logo-only-20261007" alt="ProActif Care">
<div class="nav" id="nav">
<button data-v="dash" class="active">▦ Dashboard</button>
<button data-v="clients">◉ Clientes & sedes</button>
<button data-v="reps">↻ Reposiciones</button>

</div>

<main>
<header class="top"><div><b id="title">Dashboard operativo</b><small>Abastecimiento recurrente · cuentas empresariales · reposición anticipada</small></div><div style="display:flex;gap:7px;align-items:center"><span class="badge">DATOS DEMOSTRATIVOS</span><button class="btn" onclick="restoreDemo()">Restaurar demo</button></div></header>
<div class="content">
<section id="dash" class="view active"></section><section id="clients" class="view"></section><section id="reps" class="view"></section><section id="orders" class="view"></section><section id="quotes" class="view"></section><section id="delivery" class="view"></section><section id="catalog" class="view"></section><section id="client360" class="view"></section><section id="portal" class="view"></section><section id="hygiene" class="view"></section>
</div></main></div>
<div class="modalback" id="mb"><div class="modal"><div class="modalhead"><b id="mt"></b><button class="btn" onclick="closeM()">✕</button></div><div class="modalbody" id="mbo"></div><div class="modalfoot" id="mf"></div></div></div><div class="toast" id="toast"></div>
<script>
var K='proactif-demo-v2', now=new Date(), selected='c1';
function iso(d){return new Date(d).toISOString().slice(0,10)}function add(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return iso(x)}function fd(s){if(!s)return'—';var a=s.split('-');return a[2]+'/'+a[1]+'/'+a[0]}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function seed(){return{products:[
{id:'p1',n:'Papel higiénico max pureza 300mts',b:'Proactif',c:'Pape-319',cat:'Papeles'},
{id:'p2',n:'Papel toalla intercalada',b:'Proactif',c:'Pape-207',cat:'Papeles'},
{id:'p3',n:'Dispensador ADX 700ml',b:'Gojo',c:'Mano-130',cat:'Dispensadores'},
{id:'p4',n:'Alcohol en espuma ADX',b:'Purell',c:'Mano-127',cat:'Higiene de manos'},
{id:'p5',n:'Mild foam FMX',b:'Gojo',c:'Mano-140',cat:'Higiene de manos'},
{id:'p6',n:'Dispensador de toalla intercalada',b:'Nobre',c:'Pro-823',cat:'Dispensadores'},
{id:'p7',n:'Clean By Peroxy',b:'Spartan',c:'Qui-0155',cat:'Químicos'},
{id:'p8',n:'Waterless',b:'Spartan',c:'Qui-0091',cat:'Químicos'},
{id:'p9',n:'Supro Max',b:'Gojo',c:'Mano-036',cat:'Higiene de manos'},
{id:'p10',n:'Dispensador Dropy jabón espuma',b:'Fortcom',c:'Pro-3030',cat:'Dispensadores'}],
clients:[
{id:'c1',n:'Hotel Demo',sector:'Hotelería',contact:'María Demo',phone:'0981000001',sites:[{id:'s1',n:'Hotel Centro',m:[{p:'p1',q:24,f:30,last:add(now,-26)},{p:'p2',q:18,f:30,last:add(now,-26)},{p:'p5',q:8,f:45,last:add(now,-41)}]},{id:'s2',n:'Hotel Aeropuerto',m:[{p:'p1',q:30,f:30,last:add(now,-15)},{p:'p4',q:10,f:30,last:add(now,-15)}]}]},
{id:'c2',n:'Clínica Demo',sector:'Salud',contact:'Ana Demo',phone:'0981000002',sites:[{id:'s3',n:'Sede Principal',m:[{p:'p2',q:28,f:30,last:add(now,-29)},{p:'p4',q:20,f:30,last:add(now,-29)},{p:'p7',q:6,f:30,last:add(now,-29)}]}]},
{id:'c3',n:'Industria Demo',sector:'Industria alimenticia',contact:'Carlos Demo',phone:'0981000003',sites:[{id:'s4',n:'Planta Industrial',m:[{p:'p8',q:8,f:60,last:add(now,-58)},{p:'p9',q:12,f:45,last:add(now,-44)}]}]},
{id:'c4',n:'Universidad Demo',sector:'Educación',contact:'Laura Demo',phone:'0981000004',sites:[{id:'s5',n:'Campus Central',m:[{p:'p1',q:36,f:30,last:add(now,-18)},{p:'p2',q:30,f:30,last:add(now,-18)},{p:'p10',q:6,f:90,last:add(now,-87)}]}]}],
orders:[{id:'O-1005',c:'c2',s:'s3',date:add(now,-4),req:add(now,2),st:'Cotizando',it:[{p:'p2',q:28},{p:'p4',q:20}]},{id:'O-1004',c:'c1',s:'s1',date:add(now,-8),req:add(now,-3),st:'Entregado',it:[{p:'p1',q:24},{p:'p2',q:18}]},{id:'O-1003',c:'c3',s:'s4',date:add(now,-12),req:add(now,-5),st:'Entregado',it:[{p:'p8',q:8}]}],
quotes:[{id:'COT-204',o:'O-1005',c:'c2',s:'s3',date:add(now,-3),valid:add(now,7),st:'Enviada'}],
delivery:[{id:'E-501',o:'O-1004',c:'c1',s:'s1',date:add(now,-3),st:'Entregado'},{id:'E-500',o:'O-1003',c:'c3',s:'s4',date:add(now,-5),st:'Entregado'}]}}
var S;try{S=JSON.parse(localStorage.getItem(K))||seed()}catch(e){S=seed()}S.repContact=S.repContact||{};S.repApproved=S.repApproved||{};var demoPhones={c1:'0981000001',c2:'0981000002',c3:'0981000003',c4:'0981000004'};S.clients.forEach(function(c){if(!c.phone&&demoPhones[c.id])c.phone=demoPhones[c.id]})
function save(){localStorage.setItem(K,JSON.stringify(S));render()}function C(id){return S.clients.find(function(x){return x.id===id})}function P(id){return S.products.find(function(x){return x.id===id})||{n:'Producto'}}function Site(id){for(var i=0;i<S.clients.length;i++){var x=S.clients[i].sites.find(function(z){return z.id===id});if(x)return x}return null}
function reps(){var a=[];S.clients.forEach(function(c){c.sites.forEach(function(s){s.m.forEach(function(m){var n=add(m.last,m.f),d=Math.ceil((new Date(n)-new Date(iso(now)))/86400000);a.push({c:c,s:s,m:m,n:n,d:d})})})});return a.sort(function(a,b){return a.d-b.d})}
function sc(s){if(s==='Entregado'||s==='Aceptada'||s==='Activo')return'ok';if(s==='Cotizando'||s==='Enviada'||s==='En ruta'||s==='Preparando')return'blue';return'warn'}function msg(t){var x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(function(){x.classList.remove('show')},1800)}
function openM(t,b,f){document.getElementById('mt').textContent=t;document.getElementById('mbo').innerHTML=b;document.getElementById('mf').innerHTML=f||'';document.getElementById('mb').classList.add('open')}function closeM(){document.getElementById('mb').classList.remove('open')}
function repKey(cid,sid,pid){return cid+'|'+sid+'|'+pid}
function waNumber(raw){var n=String(raw||'').replace(/\D/g,'');if(!n)return'';if(n.indexOf('595')===0)return n;return '595'+n.replace(/^0+/,'')}
function contactRep(cid,sid,pid){
 var c=C(cid),s=Site(sid),m=s&&s.m.find(function(x){return x.p===pid}),p=P(pid);
 if(!c||!s||!m)return msg('No se pudo preparar el mensaje');
 var key=repKey(cid,sid,pid),phone=waNumber(c.phone);
 var text='Hola '+(c.contact||c.n)+', desde ProActif Care queremos confirmar si desean programar la próxima reposición de '+p.n+' para '+s.n+'. Referencia habitual: '+m.q+' unidades cada '+m.f+' días. Si están de acuerdo, por favor respondan OK y avanzamos con la preparación del pedido.';
 S.repContact[key]={sent:true,date:iso(now),text:text};
 save();
 if(phone)window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(text),'_blank');
 else msg('Cliente sin número de WhatsApp cargado');
}
function markRepOk(cid,sid,pid){
 var key=repKey(cid,sid,pid);
 if(!S.repContact[key]||!S.repContact[key].sent)return msg('Primero contactá al cliente por WhatsApp');
 S.repApproved[key]=true;save();msg('Cliente marcado como OK');
}
function setOrderStatus(id,status){var o=S.orders.find(function(x){return x.id===id});if(!o)return;o.st=status;save();msg('Estado: '+status)}
function handleOrderAction(el,id){var v=el.value;if(!v)return;if(v==='quote'){el.value='';quote(id);return}if(v.indexOf('status:')===0)setOrderStatus(id,v.slice(7));el.value=''}

function dashboard(){var r=reps(),open=S.orders.filter(function(o){return o.st!=='Entregado'}).length;document.getElementById('dash').innerHTML='<div class="hero"><div><h1>Abastecimiento recurrente bajo control</h1><p>Qué consume cada cliente, en qué sede, con qué frecuencia y cuándo conviene anticipar la próxima reposición.</p></div><button class="btn primary" onclick="newOrder()">+ Crear pedido</button></div><div class="note">Demo comercial funcional. Clientes, fechas e importes son demostrativos.</div><div class="grid kpis"><div class="card kpi"><label>Cuentas</label><strong>'+S.clients.length+'</strong></div><div class="card kpi"><label>Pedidos abiertos</label><strong>'+open+'</strong></div><div class="card kpi"><label>Reposiciones ≤7 días</label><strong>'+r.filter(function(x){return x.d<=7}).length+'</strong></div><div class="card kpi"><label>Cotizaciones</label><strong>'+S.quotes.filter(function(q){return q.st!=='Aceptada'}).length+'</strong></div><div class="card kpi"><label>Entregas activas</label><strong>'+S.delivery.filter(function(d){return d.st!=='Entregado'}).length+'</strong></div><div class="card kpi"><label>Cuentas recurrentes</label><strong>'+S.clients.length+'</strong></div></div><div class="grid split"><div class="card panel"><h2>Flujo propuesto</h2><div class="flow"><button type="button" onclick="go(\'clients\')">Cliente / sede<span>Ver cuentas</span></button><button type="button" onclick="go(\'client360\')">Consumo<span>Matriz habitual</span></button><button type="button" onclick="go(\'orders\')">Pedido<span>Gestionar</span></button><button type="button" onclick="go(\'quotes\')">Cotización<span>Seguimiento</span></button><button type="button" onclick="go(\'delivery\')">Entrega<span>Despacho</span></button><button type="button" onclick="go(\'reps\')">Reposición<span>Anticipar</span></button></div><h2 style="margin-top:16px">Reposiciones más urgentes</h2>'+r.slice(0,5).map(function(x){return '<div class="alert '+(x.d<=0?'red':x.d<=7?'warn':'')+'"><b>'+esc(x.c.n)+' · '+esc(x.s.n)+'</b><p>'+esc(P(x.m.p).n)+' · '+x.m.q+' u. · '+fd(x.n)+' · '+(x.d<=0?'vencida':x.d+' días')+'</p></div>'}).join('')+'</div><div class="card panel"><h2>Alertas comerciales</h2><div class="alert warn"><b>Cotización pendiente de respuesta</b><p>Clínica Demo · COT-204</p></div><div class="alert red"><b>Reposición sugerida</b><p>Industria Demo · Planta Industrial</p></div><div class="alert warn"><b>Consumo recurrente próximo</b><p>Universidad Demo · Campus Central</p></div></div></div>'}
function clients(){document.getElementById('clients').innerHTML='<div class="hero"><div><h1>Clientes empresariales y sedes</h1><p>Múltiples sedes con consumos, responsables y frecuencias independientes.</p></div><div><button class="btn" onclick="newSite()">+ Nueva sede</button> <button class="btn primary" onclick="newClient()">+ Nuevo cliente</button></div></div><div class="toolbar"><input id="clientSearch" class="input" placeholder="Buscar empresa, sector o contacto…" oninput="filterClients()"><select id="clientSector" class="input" onchange="filterClients()"><option value="">Todos los sectores</option>'+Array.from(new Set(S.clients.map(function(c){return c.sector}))).map(function(x){return '<option>'+esc(x)+'</option>'}).join('')+'</select></div><div class="clients" id="clientList">'+S.clients.map(function(c){var n=c.sites.reduce(function(a,s){return a+s.m.length},0);return '<div class="card client" data-search="'+esc((c.n+' '+c.sector+' '+c.contact).toLowerCase())+'" data-sector="'+esc(c.sector)+'"><div><h3>'+esc(c.n)+' <span class="status ok">Activo</span></h3><p>'+esc(c.sector)+' · '+esc(c.contact)+'</p></div><div class="pills"><span class="pill">'+c.sites.length+' sede(s)</span><span class="pill">'+n+' productos recurrentes</span></div><div><button class="btn" onclick="selected=\''+c.id+'\';go(\'client360\')">Ver 360</button> <button class="btn primary" onclick="newOrder(\''+c.id+'\')">Pedido</button></div></div>'}).join('')+'</div>'}
function filterClients(){var q=(document.getElementById('clientSearch').value||'').toLowerCase(),s=document.getElementById('clientSector').value;document.querySelectorAll('#clientList .client').forEach(function(el){el.style.display=((!q||el.getAttribute('data-search').indexOf(q)>=0)&&(!s||el.getAttribute('data-sector')===s))?'grid':'none'})}
function repview(){document.getElementById('reps').innerHTML='<div class="hero"><div><h1>Reposiciones próximas</h1><p>Calculadas según último pedido y frecuencia habitual de cada producto por sede.</p></div></div><div class="table"><table><thead><tr><th>Cliente</th><th>Sede</th><th>Producto</th><th>Cant.</th><th>Frecuencia</th><th>Próxima</th><th>Estado</th><th>Acción</th></tr></thead><tbody>'+reps().map(function(x){var key=repKey(x.c.id,x.s.id,x.m.p),contacted=!!(S.repContact[key]&&S.repContact[key].sent),approved=!!S.repApproved[key];return '<tr><td>'+esc(x.c.n)+'</td><td>'+esc(x.s.n)+'</td><td>'+esc(P(x.m.p).n)+'</td><td>'+x.m.q+'</td><td>'+x.m.f+' días</td><td>'+fd(x.n)+'</td><td><span class="status '+(x.d<=0?'red':x.d<=7?'warn':'blue')+'">'+(x.d<=0?'Vencida':x.d<=7?'Sugerida':'Programada')+'</span></td><td><div class="action-stack"><button class="btn small" onclick="contactRep(\''+x.c.id+'\',\''+x.s.id+'\',\''+x.m.p+'\')">Contactar por WhatsApp</button><button class="btn small" '+(contacted?'':'disabled')+' onclick="markRepOk(\''+x.c.id+'\',\''+x.s.id+'\',\''+x.m.p+'\')">Cliente respondió OK</button><button class="btn primary small" '+(approved?'':'disabled')+' onclick="prep(\''+x.c.id+'\',\''+x.s.id+'\',\''+x.m.p+'\')">Preparar</button></div></td></tr>'}).join('')+'</tbody></table></div>'}
function orders(){document.getElementById('orders').innerHTML='<div class="hero"><div><h1>Pedidos</h1><p>Seguimiento desde recepción hasta entrega y repetición de pedidos habituales.</p></div><div><button class="btn" onclick="repeatOrder()">Repetir anterior</button> <button class="btn primary" onclick="newOrder()">+ Crear pedido</button></div></div><div class="table"><table><thead><tr><th>Pedido</th><th>Cliente / sede</th><th>Fecha</th><th>Requerido</th><th>Productos</th><th>Estado</th><th>Acción</th></tr></thead><tbody>'+S.orders.map(function(o){return '<tr><td><b>'+o.id+'</b></td><td>'+esc(C(o.c).n)+'<br><small>'+esc(Site(o.s).n)+'</small></td><td>'+fd(o.date)+'</td><td>'+fd(o.req)+'</td><td>'+o.it.length+'</td><td><span class="status '+sc(o.st)+'">'+o.st+'</span></td><td><select class="input action-select" onchange="handleOrderAction(this,\''+o.id+'\')"><option value="">Seleccionar acción…</option><option value="status:Borrador">Pasar a Borrador</option><option value="status:Recibido">Pasar a Recibido</option><option value="status:En revisión">Pasar a En revisión</option><option value="status:Cotizando">Pasar a Cotizando</option><option value="status:Confirmado">Pasar a Confirmado</option><option value="status:Preparando">Pasar a Preparando</option><option value="status:Despachado">Pasar a Despachado</option><option value="status:Entregado">Pasar a Entregado</option><option value="quote">Generar cotización</option></select></td></tr>'}).join('')+'</tbody></table></div>'}
function quotes(){document.getElementById('quotes').innerHTML='<div class="hero"><div><h1>Cotizaciones</h1><p>Convierta una solicitud en propuesta y mantenga el seguimiento comercial.</p></div></div><div class="table"><table><thead><tr><th>Cotización</th><th>Cliente</th><th>Pedido</th><th>Fecha</th><th>Vigencia</th><th>Estado</th><th>Acción</th></tr></thead><tbody>'+S.quotes.map(function(q){return '<tr><td><b>'+q.id+'</b></td><td>'+esc(C(q.c).n)+'</td><td>'+q.o+'</td><td>'+fd(q.date)+'</td><td>'+fd(q.valid)+'</td><td><span class="status '+sc(q.st)+'">'+q.st+'</span></td><td><button class="btn primary" onclick="approve(\''+q.id+'\')">Aprobar demo</button></td></tr>'}).join('')+'</tbody></table></div><div class="note" style="margin-top:10px">La demo no muestra precios reales de ProActif ni pretende ser un ERP contable.</div>'}
function delivery(){document.getElementById('delivery').innerHTML='<div class="hero"><div><h1>Entregas</h1><p>Conecta pedido confirmado con preparación, ruta y recepción.</p></div><button class="btn primary" onclick="newDelivery()">+ Crear entrega</button></div><div class="table"><table><thead><tr><th>Entrega</th><th>Pedido</th><th>Cliente / sede</th><th>Fecha</th><th>Estado</th><th>Acción</th></tr></thead><tbody>'+S.delivery.map(function(d){return '<tr><td><b>'+d.id+'</b></td><td>'+d.o+'</td><td>'+esc(C(d.c).n)+'<br><small>'+esc(Site(d.s).n)+'</small></td><td>'+fd(d.date)+'</td><td><span class="status '+sc(d.st)+'">'+d.st+'</span></td><td><button class="btn" onclick="advanceDel(\''+d.id+'\')">Cambiar estado</button></td></tr>'}).join('')+'</tbody></table></div>'}
function catalog(){document.getElementById('catalog').innerHTML='<div class="hero"><div><h1>Catálogo de referencia</h1><p>Muestra de productos publicados por ProActif. Sin carrito ni checkout: el foco es abastecimiento B2B.</p></div></div><div class="toolbar"><input id="prodSearch" class="input" placeholder="Buscar producto, marca o código…" oninput="filterProducts()"><select id="prodCat" class="input" onchange="filterProducts()"><option value="">Todas las categorías</option>'+Array.from(new Set(S.products.map(function(p){return p.cat}))).map(function(x){return '<option>'+esc(x)+'</option>'}).join('')+'</select></div><div class="products" id="productList">'+S.products.map(function(p){return '<div class="card product" data-search="'+esc((p.n+' '+p.b+' '+p.c).toLowerCase())+'" data-cat="'+esc(p.cat)+'"><small>'+esc(p.cat)+'</small><h3>'+esc(p.n)+'</h3><p>'+esc(p.b)+'</p><span class="code">'+esc(p.c)+'</span></div>'}).join('')+'</div>'}
function filterProducts(){var q=(document.getElementById('prodSearch').value||'').toLowerCase(),c=document.getElementById('prodCat').value;document.querySelectorAll('#productList .product').forEach(function(el){el.style.display=((!q||el.getAttribute('data-search').indexOf(q)>=0)&&(!c||el.getAttribute('data-cat')===c))?'block':'none'})}
function client360(){var c=C(selected)||S.clients[0];selected=c.id;var os=S.orders.filter(function(o){return o.c===c.id}),qs=S.quotes.filter(function(q){return q.c===c.id}),ds=S.delivery.filter(function(d){return d.c===c.id});document.getElementById('client360').innerHTML='<div class="hero"><div><h1>Cliente 360</h1><p>Empresa → sedes → productos → consumo → pedidos → cotizaciones → entregas → próxima reposición.</p></div><select class="input" onchange="selected=this.value;client360()">'+S.clients.map(function(x){return '<option value="'+x.id+'" '+(x.id===c.id?'selected':'')+'>'+esc(x.n)+'</option>'}).join('')+'</select></div><div class="grid split"><div class="card panel"><h2>'+esc(c.n)+' · matriz de abastecimiento</h2>'+c.sites.map(function(s){return '<div class="alert"><b>'+esc(s.n)+'</b><p>'+s.m.length+' productos recurrentes</p><div class="table" style="margin-top:8px"><table><thead><tr><th>Producto</th><th>Cant.</th><th>Frecuencia</th><th>Último</th><th>Próximo</th></tr></thead><tbody>'+s.m.map(function(m){return '<tr><td>'+esc(P(m.p).n)+'</td><td>'+m.q+'</td><td>'+m.f+' días</td><td>'+fd(m.last)+'</td><td>'+fd(add(m.last,m.f))+'</td></tr>'}).join('')+'</tbody></table></div></div>'}).join('')+'<button class="btn" style="margin-top:10px" onclick="addHabitual(\''+c.id+'\')">+ Producto habitual</button></div><div class="card panel"><h2>Resumen de cuenta</h2><div class="pills"><span class="pill">'+c.sites.length+' sedes</span><span class="pill">'+os.length+' pedidos</span><span class="pill">'+qs.length+' cotizaciones</span><span class="pill">'+ds.length+' entregas</span></div><h2 style="margin-top:18px">Acciones</h2><button class="btn primary" onclick="newOrder(\''+c.id+'\')">Crear pedido</button> <button class="btn" onclick="selected=\''+c.id+'\';go(\'portal\')">Abrir portal cliente</button></div></div>'}
function addHabitual(cid){var c=C(cid);if(!c.sites.length)return msg('El cliente necesita una sede');openM('Agregar producto habitual','<div class="form"><div class="field"><label>Sede</label><select id="hs">'+c.sites.map(function(s){return '<option value="'+s.id+'">'+esc(s.n)+'</option>'}).join('')+'</select></div><div class="field"><label>Producto</label><select id="hp">'+S.products.map(function(p){return '<option value="'+p.id+'">'+esc(p.n)+'</option>'}).join('')+'</select></div><div class="field"><label>Cantidad habitual</label><input id="hq" type="number" min="1" value="10"></div><div class="field"><label>Frecuencia (días)</label><input id="hf" type="number" min="1" value="30"></div></div>','<button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="saveHabitual()">Guardar</button>')}
function saveHabitual(){var sid=document.getElementById('hs').value,pid=document.getElementById('hp').value,s=Site(sid);s.m.push({p:pid,q:+document.getElementById('hq').value||1,f:+document.getElementById('hf').value||30,last:iso(now)});closeM();save();client360();msg('Producto habitual agregado')}
function hygiene(){document.getElementById('hygiene').innerHTML='<div class="hero"><div><h1>Sistema de higiene por cliente</h1><p>Espacio para documentar la solución técnica definida por ProActif para cada área, sin inventar mezclas ni recomendaciones químicas.</p></div></div><div class="note">Ejemplo conceptual. Las recomendaciones concretas deben provenir de la asesoría técnica y fichas oficiales de ProActif.</div><div class="products"><div class="card product"><small>Hotelería</small><h3>Hotel Demo · Habitaciones</h3><p>Estandarizar consumibles, dispensadores y frecuencia de reposición según evaluación técnica.</p></div><div class="card product"><small>Salud</small><h3>Clínica Demo · Áreas comunes</h3><p>Registrar solución aprobada de higiene de manos y abastecimiento asociado.</p></div><div class="card product"><small>Industria alimenticia</small><h3>Industria Demo · Operación</h3><p>Documentar productos y herramientas autorizados para la aplicación correspondiente.</p></div></div>'}
function portal(){var c=C(selected)||S.clients[0];document.getElementById('portal').innerHTML='<div class="hero"><div><h1>Portal del cliente</h1><p>Vista simplificada para repetir pedidos y revisar sus productos habituales.</p></div><select class="input" onchange="selected=this.value;portal()">'+S.clients.map(function(x){return '<option value="'+x.id+'" '+(x.id===c.id?'selected':'')+'>'+esc(x.n)+'</option>'}).join('')+'</select></div><div class="grid split"><div class="card panel"><h2>'+esc(c.n)+' · productos habituales</h2>'+c.sites.map(function(s){return s.m.map(function(m){return '<div class="alert"><b>'+esc(P(m.p).n)+'</b><p>'+esc(s.n)+' · '+m.q+' u. cada '+m.f+' días</p></div>'}).join('')}).join('')+'</div><div class="card panel"><h2>Solicitudes</h2>'+S.orders.filter(function(o){return o.c===c.id}).map(function(o){return '<div class="alert"><b>'+o.id+' · '+o.st+'</b><p>'+o.it.length+' producto(s) · requerido '+fd(o.req)+'</p></div>'}).join('')+'<button class="btn primary" style="margin-top:12px" onclick="newOrder(\''+c.id+'\')">Solicitar / repetir pedido</button></div></div>'}
function render(){dashboard();clients();repview();orders();quotes();delivery();catalog();client360();portal();hygiene()}
function go(id){document.querySelectorAll('.view').forEach(function(v){v.classList.toggle('active',v.id===id)});document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-v')===id)});var n={dash:'Dashboard operativo',clients:'Clientes empresariales',reps:'Reposiciones próximas',orders:'Pedidos',quotes:'Cotizaciones',delivery:'Entregas',catalog:'Catálogo de referencia',client360:'Cliente 360',portal:'Portal del cliente',hygiene:'Sistema de higiene'};document.getElementById('title').textContent=n[id]||'ProActif Care Hub'}
var returnToOrderAfterClient=false;
function newClient(fromOrder){returnToOrderAfterClient=!!fromOrder;openM('Nuevo cliente','<div class="form"><div class="field"><label>Empresa</label><input id="cn"></div><div class="field"><label>Sector</label><select id="cs"><option>Hotelería</option><option>Salud</option><option>Gastronomía</option><option>Corporativo</option><option>Educación</option><option>Industria alimenticia</option><option>Grandes áreas</option><option>Otro</option></select></div><div class="field"><label>Contacto</label><input id="cc"></div><div class="field"><label>WhatsApp</label><input id="cp" placeholder="0981 000 000"></div><div class="field full"><label>Sede inicial</label><input id="csite" placeholder="Ej.: Sede Principal"></div></div>','<button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="saveClient()">Crear cliente</button>')}
function saveClient(){var n=document.getElementById('cn').value.trim(),sn=document.getElementById('csite').value.trim();if(!n)return msg('Ingresá la empresa');if(!sn)return msg('Ingresá una sede inicial');var id='c'+Date.now(),sid='s'+Date.now();S.clients.push({id:id,n:n,sector:document.getElementById('cs').value,contact:document.getElementById('cc').value||'Contacto',phone:document.getElementById('cp').value,sites:[{id:sid,n:sn,m:[]}]});var back=returnToOrderAfterClient;returnToOrderAfterClient=false;closeM();save();if(back){newOrder(id);msg('Cliente creado. Continuá con el pedido')}else msg('Cliente creado')}
function newSite(){if(!S.clients.length)return;openM('Nueva sede','<div class="form"><div class="field"><label>Cliente</label><select id="sc">'+S.clients.map(function(c){return '<option value="'+c.id+'">'+esc(c.n)+'</option>'}).join('')+'</select></div><div class="field"><label>Nombre de sede</label><input id="sn"></div><div class="field full"><label>Responsable</label><input id="sr"></div></div>','<button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="saveSite()">Crear sede</button>')}
function saveSite(){var n=document.getElementById('sn').value.trim();if(!n)return msg('Ingresá el nombre de la sede');var c=C(document.getElementById('sc').value);c.sites.push({id:'s'+Date.now(),n:n,m:[]});closeM();save();msg('Sede creada')}
function restoreDemo(){if(confirm('¿Restaurar todos los datos originales de la demo?')){S=seed();selected='c1';localStorage.setItem(K,JSON.stringify(S));render();go('dash');msg('Demo restaurada')}}
function newOrder(cid){var c=C(cid)||S.clients[0];openM('Crear pedido','<div class="form"><div class="field"><div class="field-head"><label>Cliente</label><button type="button" class="btn small" onclick="newClient(true)">+ Nuevo cliente</button></div><select id="oc" onchange="fillSites()">'+S.clients.map(function(x){return '<option value="'+x.id+'" '+(x.id===c.id?'selected':'')+'>'+esc(x.n)+'</option>'}).join('')+'</select></div><div class="field"><label>Sede</label><select id="os">'+c.sites.map(function(s){return '<option value="'+s.id+'">'+esc(s.n)+'</option>'}).join('')+'</select></div><div class="field"><label>Producto</label><select id="op">'+S.products.map(function(p){return '<option value="'+p.id+'">'+esc(p.n)+'</option>'}).join('')+'</select></div><div class="field"><label>Cantidad</label><input type="number" id="oq" value="1" min="1"></div><div class="field full"><label>Fecha requerida</label><input type="date" id="or" value="'+add(now,5)+'"></div></div>','<button class="btn" onclick="closeM()">Cancelar</button><button class="btn primary" onclick="saveOrder()">Crear pedido</button>')}
function fillSites(){var c=C(document.getElementById('oc').value);document.getElementById('os').innerHTML=c.sites.map(function(s){return '<option value="'+s.id+'">'+esc(s.n)+'</option>'}).join('')}
function saveOrder(){var cid=document.getElementById('oc').value,sid=document.getElementById('os').value;if(!sid)return msg('El cliente necesita una sede');S.orders.unshift({id:'O-'+(1006+S.orders.length),c:cid,s:sid,date:iso(now),req:document.getElementById('or').value,st:'Recibido',it:[{p:document.getElementById('op').value,q:+document.getElementById('oq').value||1}]});closeM();save();msg('Pedido creado')}
function repeatOrder(){var o=S.orders.find(function(x){return x.st==='Entregado'})||S.orders[0];if(!o)return;S.orders.unshift({id:'O-'+(1006+S.orders.length),c:o.c,s:o.s,date:iso(now),req:add(now,5),st:'Recibido',it:o.it.map(function(i){return{p:i.p,q:i.q}})});save();msg('Pedido anterior repetido')}
function prep(cid,sid,pid){var key=repKey(cid,sid,pid);if(!S.repApproved[key])return msg('Primero registrá el OK del cliente');var s=Site(sid),m=s.m.find(function(x){return x.p===pid});S.orders.unshift({id:'O-'+(1006+S.orders.length),c:cid,s:sid,date:iso(now),req:add(now,5),st:'Borrador',it:[{p:pid,q:m.q}]});save();go('orders');msg('Reposición preparada')}
function advance(id){var o=S.orders.find(function(x){return x.id===id}),a=['Borrador','Recibido','En revisión','Cotizando','Confirmado','Preparando','Despachado','Entregado'],i=a.indexOf(o.st);o.st=a[Math.min(i+1,a.length-1)];save();msg('Estado: '+o.st)}
function quote(oid){var o=S.orders.find(function(x){return x.id===oid});var id='COT-'+(205+S.quotes.length);if(S.quotes.some(function(q){return q.o===oid}))return msg('Ese pedido ya tiene cotización demo');S.quotes.unshift({id:id,o:o.id,c:o.c,s:o.s,date:iso(now),valid:add(now,10),st:'Enviada'});o.st='Cotizando';save();go('quotes');msg('Cotización creada')}
function approve(id){var q=S.quotes.find(function(x){return x.id===id});q.st='Aceptada';var o=S.orders.find(function(x){return x.id===q.o});if(o)o.st='Confirmado';save();msg('Cotización aprobada')}
function newDelivery(){var o=S.orders.find(function(x){return x.st==='Confirmado'});if(!o)return msg('Primero confirmá un pedido');S.delivery.unshift({id:'E-'+(502+S.delivery.length),o:o.id,c:o.c,s:o.s,date:add(now,1),st:'Pendiente'});save();msg('Entrega creada')}
function advanceDel(id){var d=S.delivery.find(function(x){return x.id===id}),a=['Pendiente','Preparando','En ruta','Entregado'],i=a.indexOf(d.st);d.st=a[Math.min(i+1,a.length-1)];if(d.st==='Entregado'){var o=S.orders.find(function(x){return x.id===d.o});if(o)o.st='Entregado'}save();msg('Entrega: '+d.st)}
document.getElementById('nav').onclick=function(e){var b=e.target.closest('button[data-v]');if(b)go(b.getAttribute('data-v'))};document.getElementById('mb').onclick=function(e){if(e.target.id==='mb')closeM()};render();
</script>
</body></html>
